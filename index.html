<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro EGEL Informática Avanzado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --ink: #000000;
  --accent: #FF5900;
  --accent-ink: #000000;
  --tint: #FFEEE5;
  --muted: rgba(0, 0, 0, .66);
  --line: rgba(0, 0, 0, .2);
  --track: rgba(0, 0, 0, .1);
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
.wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Barra superior */
.hdr {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: #000; color: #fff; border-radius: 0 0 10px 10px;
  padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.hl { display: flex; flex-direction: column; min-width: 0; }
.hl strong { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.hl span { font-size: 13px; color: rgba(255,255,255,.78); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hr { display: flex; align-items: center; gap: 12px; flex: none; }
.cnt { font-family: var(--font-mono); font-size: 13px; color: rgba(255,255,255,.85); }
.clock { font-family: var(--font-mono); font-size: 22px; font-weight: 600; background: var(--accent); color: #000; padding: 2px 12px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.clock.low { outline: 3px solid #fff; outline-offset: 0; }

.card { background: #fff; border: 1.5px solid #000; border-radius: 10px; padding: 24px; }
.btn { border: 1.5px solid #000; background: #fff; border-radius: 8px; padding: 10px 18px; font-weight: 500; min-height: 44px; }
.btn:hover { background: var(--tint); }
.btn.primary { background: var(--accent); border-color: #000; color: #000; font-weight: 600; }
.btn.primary:hover { background: #E84F00; }
.btn.dark { background: #000; color: #fff; }
.btn.dark:hover { background: #222; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn:disabled:hover { background: #fff; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }

/* Bienvenida */
.hero { border-top: 8px solid var(--accent); }
.hero h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 600; }
.hero .lead { color: var(--muted); max-width: 62ch; margin-top: 10px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 22px 0; }
.fact { border: 1.5px solid #000; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fact b { font-family: var(--font-mono); font-size: 26px; font-weight: 600; background: linear-gradient(transparent 62%, var(--accent) 62%); align-self: flex-start; }
.fact span { font-size: 14px; }
.rules { margin: 0 0 22px; padding-left: 20px; color: var(--muted); max-width: 66ch; }
.rules li { margin-bottom: 4px; }
.field { display: flex; flex-direction: column; gap: 6px; max-width: 460px; }
.field label { font-weight: 600; }
.field input { font: inherit; color: #000; background: #fff; border: 1.5px solid #000; border-radius: 8px; padding: 11px 14px; min-height: 46px; width: 100%; }
.field input:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
.resume { border: 2px dashed var(--accent); border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }

/* Examen */
.bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.chip { display: inline-block; font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; background: #000; color: #fff; border-radius: 6px; padding: 3px 9px; }
.chip.o { background: var(--accent); color: #000; font-weight: 600; }
.qhead { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.qnum { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.case { background: var(--tint); border-left: 8px solid var(--accent); border-radius: 0 8px 8px 0; padding: 16px 20px; margin-bottom: 20px; font-family: var(--font-read); font-size: 17px; line-height: 1.7; display: flex; flex-direction: column; gap: 10px; }
.case .ct { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.qtext { font-size: 18px; line-height: 1.6; max-width: 72ch; font-weight: 500; }

.case pre, .qtext pre { font-family: var(--font-mono); font-size: 13px; line-height: 1.5; background: #fff; border: 1.5px solid #000; border-radius: 6px; padding: 10px 12px; margin: 10px 0; overflow-x: auto; white-space: pre; font-weight: 400; }
.case .tw, .qtext .tw { overflow-x: auto; margin: 10px 0; }
.case table, .qtext table { min-width: 0; width: auto; font-family: var(--font-body); font-size: 14px; font-weight: 400; background: #fff; }
.case th, .case td, .qtext th, .qtext td { padding: 6px 12px; border: 1.5px solid #000; text-align: left; }
.case th, .qtext th { font-size: 12px; }
code { font-family: var(--font-mono); font-size: .88em; background: rgba(0,0,0,.07); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; background: #fff; border: 1.5px solid #000; border-radius: 8px; padding: 14px 16px; }
.opt:hover { background: var(--tint); }
.opt .ltr { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid #000; font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.opt .txt { min-width: 0; overflow-wrap: anywhere; }
.opt[aria-checked="true"] { border-width: 3px; padding: 12.5px 14.5px; background: var(--tint); border-color: var(--accent); }
.opt[aria-checked="true"] .ltr { background: var(--accent); }
.flag { border: 1.5px solid #000; border-radius: 8px; background: #fff; padding: 8px 14px; min-height: 40px; display: inline-flex; gap: 8px; align-items: center; font-size: 14px; }
.flag[aria-pressed="true"] { background: var(--accent); font-weight: 600; }
.flag i { width: 12px; height: 12px; background: currentColor; clip-path: polygon(0 0, 100% 0, 100% 100%); display: inline-block; }

.map { display: flex; flex-direction: column; gap: 14px; }
.map h3 { font-size: 13px; font-family: var(--font-mono); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.maprow { display: flex; flex-direction: column; gap: 6px; }
.maprow .lab { font-size: 13px; font-weight: 600; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { position: relative; width: 38px; height: 38px; border-radius: 6px; border: 1.5px solid #000; background: #fff; font-family: var(--font-mono); font-size: 13px; padding: 0; }
.dot.done { background: #000; color: #fff; }
.dot.cur { outline: 3px solid var(--accent); outline-offset: 2px; background: var(--accent); color: #000; font-weight: 600; }
.dot.fl::after { content: ""; position: absolute; top: -1.5px; right: -1.5px; width: 13px; height: 13px; background: var(--accent); border: 1.5px solid #000; clip-path: polygon(0 0, 100% 0, 100% 100%); }
.dot.done.fl::after { border-color: #fff; }
.legend { font-size: 13px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border: 1.5px solid #000; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: #fff; }
.legend .l1::before { background: #000; } .legend .l2::before { background: var(--accent); }

.confirm { border: 3px solid var(--accent); border-radius: 8px; padding: 14px 16px; background: var(--tint); display: flex; flex-direction: column; gap: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: #000; color: #fff; border-left: 8px solid var(--accent); padding: 12px 18px; border-radius: 8px; z-index: 40; max-width: calc(100vw - 32px); font-weight: 500; }

/* Resultados */
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
.score .big { font-family: var(--font-mono); font-size: clamp(40px, 8vw, 64px); font-weight: 600; line-height: 1; background: linear-gradient(transparent 70%, var(--accent) 70%); }
.score .pct { font-size: 18px; color: var(--muted); }
.banner { background: var(--accent); border: 1.5px solid #000; border-radius: 8px; padding: 10px 14px; font-weight: 600; margin-top: 14px; }
.tablewrap { overflow-x: auto; margin-top: 16px; }
table { border-collapse: collapse; width: 100%; min-width: 600px; }
th, td { text-align: left; padding: 11px 12px; border-bottom: 1.5px solid var(--line); vertical-align: middle; }
th { background: #000; color: #fff; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 600; background: var(--tint); border-bottom: none; }
.meter { width: 120px; height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; display: inline-block; vertical-align: middle; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.lvl { font-size: 12px; font-weight: 600; white-space: nowrap; padding: 3px 10px; border-radius: 999px; border: 2px solid #000; font-family: var(--font-mono); }
.lvl.good { background: #000; color: #fff; }
.lvl.mid { background: var(--accent); color: #000; }
.lvl.low { background: #fff; border-color: var(--accent); }
.note { font-size: 13px; color: var(--muted); margin-top: 12px; }
.review { display: flex; flex-direction: column; gap: 14px; }
.rcard { border-left: 8px solid var(--accent); }
details.dcase { margin: 0 0 14px; }
details.dcase summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 6px 0; }
details.dcase .case { margin: 8px 0 0; }
.ans { display: flex; gap: 10px; align-items: flex-start; border-radius: 8px; padding: 10px 12px; margin-top: 10px; border: 1.5px solid #000; }
.ans .tag { flex: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; padding-top: 3px; min-width: 96px; }
.ans.bad { border: 3px solid var(--accent); padding: 8px 10px; }
.ans.good { background: #000; color: #fff; }
.why { margin-top: 12px; font-size: 15px; color: var(--muted); }
.why b { color: #000; }
.empty { text-align: center; padding: 28px 12px; font-weight: 600; }

@media (max-width: 560px) {
  .card { padding: 18px; }
  .qtext { font-size: 17px; }
  .case { font-size: 16px; padding: 14px 16px; }
  .ans { flex-direction: column; gap: 2px; }
  .ans .tag { padding-top: 0; }
  .hl span { display: none; }
  .clock { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<body>
<div class="wrap">
  <header class="hdr" id="hdr"></header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const TOTAL_MIN = 80;
const AREAS = [
  { name: 'Necesidades informáticas de una organización', short: 'Necesidades informáticas' },
  { name: 'Gestión de proyectos informáticos', short: 'Gestión de proyectos' },
  { name: 'Implementación de sistemas de información', short: 'Implementación de sistemas' },
  { name: 'Función informática', short: 'Función informática' }
];

const CASES = {
  A: { t: 'Distribuidora Caribe (base de datos)', p: [
    `Distribuidora Caribe vende abarrotes a tiendas de la península. Su base de datos relacional, con más de 40 millones de pedidos históricos, tiene las siguientes tablas (el primer campo de cada una es su llave primaria; en detalle_pedido la llave es la combinación de los dos primeros):`,
    `<pre>cliente(id_cliente, nombre, ciudad)
pedido(id_pedido, id_cliente, fecha, estatus)
detalle_pedido(id_pedido, id_producto, cantidad, precio_unitario)
producto(id_producto, nombre, categoria, existencia)</pre>`,
    `El estatus de un pedido puede ser «Capturado», «Entregado» o «Cancelado». La dirección comercial solicita varios análisis y el equipo de TI debe construir las consultas y atender los problemas de rendimiento de la base.`] },
  B: { t: 'Campus de la Universidad Ítaca (redes)', p: [
    `La Universidad Ítaca asignó el bloque 10.20.0.0/22 para su campus. Se requieren cuatro subredes: Administrativos (200 equipos), Docentes (100 equipos), Laboratorios (50 equipos) y un enlace punto a punto entre dos routers (2 direcciones). El plan es asignarlas con VLSM, de mayor a menor tamaño, sin traslape.`,
    `El campus tiene dos switches de acceso, SW1 y SW2, conectados entre sí por un solo enlace. Cada switch tiene equipos de la VLAN 10 (Administrativos) y de la VLAN 20 (Docentes). Un router con una interfaz por VLAN enruta entre ellas y un firewall protege el servidor de expedientes escolares, con dirección 10.20.0.50, ubicado en la VLAN 10.`] },
  C: { t: 'Plataforma de entregas Ruta Viva', p: [
    `Ruta Viva es una plataforma de entregas a domicilio construida como una sola aplicación monolítica (un único artefacto que se despliega completo) con una base de datos central. Incluye los módulos de pedidos, pagos, facturación y rastreo de repartidores en tiempo real. Cualquier cambio, por pequeño que sea, exige liberar toda la aplicación y detener el servicio unos 20 minutos.`,
    `En horas pico, el módulo de rastreo, que recibe la ubicación de miles de repartidores cada pocos segundos, consume casi toda la CPU del servidor y ralentiza el módulo de pagos. El equipo es de ocho desarrolladores, la empresa no puede detener operaciones durante semanas y se prevé integrar varios proveedores de pago en los próximos meses.`] },
  D: { t: 'Migración del ERP de Textiles del Sur', p: [
    `Textiles del Sur migrará su ERP a la nube en un proyecto de 12 meses con un presupuesto total (BAC) de $1,200,000. Al cierre del mes 5, el gerente del proyecto presenta este reporte:`,
    `<div class="tw"><table><thead><tr><th>Indicador</th><th>Monto</th></tr></thead><tbody><tr><td>Valor planificado (PV)</td><td>$500,000</td></tr><tr><td>Valor ganado (EV)</td><td>$420,000</td></tr><tr><td>Costo real (AC)</td><td>$480,000</td></tr></tbody></table></div>`,
    `El registro de riesgos incluye tres amenazas con su impacto ya estimado en costo:`,
    `<div class="tw"><table><thead><tr><th>Riesgo</th><th>Probabilidad</th><th>Impacto</th></tr></thead><tbody><tr><td>R1. Retraso del proveedor de licencias</td><td>70 %</td><td>$50,000</td></tr><tr><td>R2. Pérdida de datos durante la migración</td><td>20 %</td><td>$400,000</td></tr><tr><td>R3. Resistencia al cambio de usuarios clave</td><td>50 %</td><td>$120,000</td></tr></tbody></table></div>`] },
  E: { t: 'Mesa de servicio de Grupo Nauhtli', p: [
    `La mesa de servicio de Grupo Nauhtli (1,200 empleados) opera de lunes a viernes de 8:00 a 20:00, y los tiempos del acuerdo de nivel de servicio (SLA) se cuentan solo dentro de ese horario. La prioridad de cada ticket se determina con esta matriz de impacto y urgencia. Los tiempos objetivo de resolución son: P1, 4 horas; P2, 8 horas; P3, 24 horas; P4, 48 horas.`,
    `<div class="tw"><table><thead><tr><th></th><th>Urgencia alta</th><th>Urgencia media</th><th>Urgencia baja</th></tr></thead><tbody><tr><td>Impacto alto</td><td>P1</td><td>P2</td><td>P3</td></tr><tr><td>Impacto medio</td><td>P2</td><td>P3</td><td>P4</td></tr><tr><td>Impacto bajo</td><td>P3</td><td>P4</td><td>P4</td></tr></tbody></table></div>`,
    `Entre las 9:00 y las 9:30 de hoy llegaron los siguientes reportes:`,
    `<div class="tw"><table><thead><tr><th>Ticket</th><th>Reporte</th><th>Impacto</th><th>Urgencia</th></tr></thead><tbody><tr><td>T1</td><td>«No puedo imprimir; hay otra impresora disponible en el piso.»</td><td>Bajo</td><td>Baja</td></tr><tr><td>T2</td><td>«El ERP no permite facturar en la sucursal Cancún (40 usuarios) y hoy es el cierre de mes.»</td><td>Alto</td><td>Alta</td></tr><tr><td>T3</td><td>«La VPN falla a un directivo que viaja y mañana presenta resultados a inversionistas.»</td><td>Bajo</td><td>Alta</td></tr><tr><td>T4</td><td>«La aplicación de nómina falla en Recursos Humanos (6 usuarios) y la dispersión de nómina es mañana.»</td><td>Medio</td><td>Alta</td></tr></tbody></table></div>`] }
};
 
const Q = [ 
  { a: 0, q: `Una sucursal con 80 empleados contratará un enlace a Internet. Se estima que 25 % de los empleados estará simultáneamente en videollamadas HD de 3 Mbps cada una, y que los 80 usarán un ERP en la nube que consume 0.5 Mbps por usuario. La dirección pide un margen de crecimiento de 20 % sobre la demanda máxima. ¿Qué capacidad mínima debe tener el enlace?`,
    o: [`120 Mbps: demanda máxima de 100 Mbps (60 de videollamadas y 40 del ERP) más 20 % de margen.`,
        `100 Mbps: demanda máxima de 60 Mbps de videollamadas y 40 del ERP, sin considerar el margen solicitado.`,
        `336 Mbps: se supone que los 80 empleados estarán en videollamada a la vez, más el ERP y el 20 % de margen.`],
    e: `Videollamadas: 25 % × 80 = 20 usuarios × 3 Mbps = 60 Mbps. ERP: 80 × 0.5 = 40 Mbps. Demanda máxima = 100 Mbps; con 20 % de margen, 120 Mbps. La segunda opción omite el margen y la tercera ignora el 25 % de simultaneidad.` },
  { a: 0, q: `Un servidor de base de datos transaccional realiza muchas escrituras pequeñas por segundo. Debe tolerar la falla de un disco sin degradar significativamente el rendimiento. ¿Qué configuración de discos es la más adecuada?`,
    o: [`RAID 10: espejo con distribución; buen rendimiento de escritura y tolera la falla de un disco por cada espejo.`,
        `RAID 5: paridad distribuida; mayor capacidad útil, pero con penalización en las escrituras pequeñas.`,
        `RAID 0: distribución sin redundancia; máximo rendimiento, pero cualquier falla de disco pierde los datos.`],
    e: `Muchas escrituras pequeñas penalizan a RAID 5 por el cálculo de paridad, y RAID 0 no tolera fallas. RAID 10 combina rendimiento y tolerancia a la falla de un disco.` },
  { a: 0, q: `Una empresa ejecuta en la nube su sistema de nómina, con carga estable las 24 horas durante los próximos tres años, y además un proceso nocturno de reportes que puede interrumpirse y reiniciarse sin consecuencias. ¿Qué combinación de modelos de compra minimiza el costo?`,
    o: [`Instancias reservadas a tres años para la nómina e instancias interrumpibles (spot) para los reportes nocturnos.`,
        `Instancias interrumpibles (spot) para la nómina e instancias reservadas a tres años para los reportes nocturnos.`,
        `Instancias bajo demanda con escalado automático para ambas cargas, para conservar la flexibilidad.`],
    e: `La carga estable y continua es ideal para capacidad reservada; la tolerante a interrupciones es ideal para capacidad interrumpible (spot), mucho más barata. Invertir los modelos expone la nómina a interrupciones o paga de más por los reportes.` },
  { a: 0, q: `Una aplicación depende en serie de un servidor de aplicaciones con disponibilidad de 99.9 % y de una base de datos con 99.5 %. Para mejorar el servicio, se duplica la base de datos en una configuración activa-activa, en la que basta con que una de las dos funcione. ¿Cuál es la disponibilidad aproximada del conjunto?`,
    o: [`Aproximadamente 99.90 %: la base de datos duplicada alcanza 99.9975 % y se combina en serie con 99.9 % del servidor.`,
        `Aproximadamente 99.40 %: es el producto de 99.9 % y 99.5 %, pues la duplicación no cambia la disponibilidad.`,
        `Aproximadamente 99.998 %: la base de datos duplicada domina el resultado y la disponibilidad del servidor ya no influye.`],
    e: `En paralelo: 1 − (0.005 × 0.005) = 0.999975. En serie con el servidor: 0.999 × 0.999975 ≈ 0.99898, es decir, cerca de 99.90 %. El servidor de aplicaciones sigue siendo un punto único de falla que limita el resultado.` },
  { a: 0, q: `Una empresa publicará un portal web accesible desde Internet que consulta una base de datos con información de clientes. ¿Qué arquitectura de red reduce mejor el riesgo ante el compromiso del servidor web?`,
    o: [`Servidor web en una zona desmilitarizada (DMZ) y base de datos en la red interna, con reglas que solo permiten al servidor web consultarla en el puerto requerido.`,
        `Servidor web y base de datos juntos en la DMZ, para minimizar la latencia entre ambos y simplificar las reglas del firewall.`,
        `Servidor web en la red interna, con el firewall perimetral redirigiendo el puerto 443 de Internet directamente hacia él.`],
    e: `La DMZ aísla el servicio expuesto; la base de datos permanece en la red interna con acceso restringido al servidor web. Colocar ambos en la DMZ o exponer directamente la red interna aumenta el daño posible si se compromete el servidor.` },
  { a: 0, q: `Una empresa compara dos opciones para un sistema de gestión documental durante tres años. Opción A: licencia perpetua de $90,000 más mantenimiento anual de 20 % del precio de la licencia, pagadero cada año. Opción B: suscripción de $2,800 mensuales. ¿Qué opción cuesta menos a tres años y cuál es la diferencia?`,
    o: [`La suscripción: $100,800 frente a $144,000 de la licencia perpetua con mantenimiento; ahorra $43,200.`,
        `La licencia perpetua: $90,000 frente a $100,800 de la suscripción; ahorra $10,800.`,
        `La suscripción: $100,800 frente a $108,000 de la licencia con un solo año de mantenimiento; ahorra $7,200.`],
    e: `Licencia: 90,000 + 3 × (20 % × 90,000) = 90,000 + 54,000 = 144,000. Suscripción: 36 × 2,800 = 100,800. Diferencia: 43,200. Las otras opciones omiten el mantenimiento de dos o tres años.` },
  { a: 0, q: `Un proyecto de automatización requiere una inversión de $800,000 y generará ahorros de $350,000 por año. ¿Cuál es su periodo de recuperación y su ROI a tres años?`,
    o: [`Periodo de recuperación de 2.3 años y ROI de 31 % a tres años.`,
        `Periodo de recuperación de 2.3 años y ROI de 131 % a tres años.`,
        `Periodo de recuperación de 3.0 años y ROI de 31 % a tres años.`],
    e: `Recuperación = 800,000 ÷ 350,000 ≈ 2.29 años. Ahorros a tres años = 1,050,000. ROI = (1,050,000 − 800,000) ÷ 800,000 = 31.25 %. El 131 % resulta de dividir los ahorros totales entre la inversión sin restarla.` },
  { a: 0, q: `Una empresa desea ejecutar docenas de instancias de un servicio ligero con arranque en segundos y alta densidad por servidor, todas sobre el mismo sistema operativo Linux, y desplegarlo de forma idéntica en desarrollo y producción. ¿Qué tecnología responde mejor a la necesidad?`,
    o: [`Contenedores: comparten el núcleo del sistema operativo y aíslan procesos, con arranque rápido y alta densidad.`,
        `Máquinas virtuales completas: cada una con su propio sistema operativo invitado sobre un hipervisor.`,
        `Servidores físicos dedicados: una instancia por servidor, con aislamiento total del hardware.`],
    e: `Arranque en segundos, alta densidad y mismo sistema operativo son ventajas de los contenedores. Las máquinas virtuales cargan un sistema operativo por instancia y los servidores dedicados desperdician capacidad.` },
  { a: 0, q: `Un comité evalúa tres proveedores de nube con una matriz ponderada. Los pesos son: costo 50 %, soporte 20 %, escalabilidad 20 % y seguridad 10 %. Las calificaciones (de 0 a 10) son:
<div class="tw"><table><thead><tr><th>Proveedor</th><th>Costo</th><th>Soporte</th><th>Escalabilidad</th><th>Seguridad</th></tr></thead><tbody><tr><td>X</td><td>9</td><td>6</td><td>6</td><td>6</td></tr><tr><td>Y</td><td>8</td><td>8</td><td>7</td><td>7</td></tr><tr><td>Z</td><td>6</td><td>10</td><td>9</td><td>8</td></tr></tbody></table></div>
¿Qué proveedor obtiene la mayor calificación ponderada?`,
    o: [`Proveedor Y, con 7.70 puntos ponderados.`,
        `Proveedor Z, con 8.25 puntos, que es su promedio simple sin ponderar.`,
        `Proveedor X, con 9 puntos, por su calificación en el criterio de mayor peso.`],
    e: `Y = 8(0.5) + 8(0.2) + 7(0.2) + 7(0.1) = 7.70; Z = 6(0.5) + 10(0.2) + 9(0.2) + 8(0.1) = 7.60; X = 9(0.5) + 6(0.2) + 6(0.2) + 6(0.1) = 7.50. Z gana solo si se ignoran los pesos y X solo si se mira únicamente el costo.` },
 
  { a: 1, c: 'D', q: `¿Cuál es la interpretación correcta de la variación del costo (CV) y la variación del cronograma (SV) del proyecto?`,
    o: [`CV = −$60,000 y SV = −$80,000: gasta más de lo que ha ganado y avanza más lento de lo planeado.`,
        `CV = −$80,000 y SV = −$60,000: gasta más de lo que ha ganado y avanza más lento de lo planeado.`,
        `CV = +$60,000 y SV = +$80,000: gasta menos de lo que ha ganado y avanza más rápido de lo planeado.`],
    e: `CV = EV − AC = 420,000 − 480,000 = −60,000. SV = EV − PV = 420,000 − 500,000 = −80,000. Ambos negativos indican sobrecosto y retraso. La segunda opción invierte las fórmulas.` },
  { a: 1, c: 'D', q: `Para terminar el proyecto dentro del presupuesto original (BAC), ¿cuál es el índice de desempeño del trabajo por completar (TCPI) y qué significa?`,
    o: [`TCPI = 1.08: el trabajo restante debe ejecutarse con una eficiencia de costo mayor que la lograda hasta ahora (CPI de 0.88).`,
        `TCPI = 0.92: el trabajo restante puede ejecutarse con menor eficiencia de costo que la lograda hasta ahora.`,
        `TCPI = 0.88: basta con mantener el CPI actual para cerrar dentro del presupuesto original.`],
    e: `TCPI = (BAC − EV) ÷ (BAC − AC) = 780,000 ÷ 720,000 ≈ 1.08. Como es mayor que el CPI actual (420 ÷ 480 = 0.875), se necesita más eficiencia que la observada. 0.92 es el inverso, y mantener 0.88 produciría un sobrecosto.` },
  { a: 1, c: 'D', q: `De acuerdo con el análisis cuantitativo de riesgos, ¿qué riesgo tiene el mayor valor monetario esperado (VME) y a cuánto asciende la reserva para contingencias si se cubre el VME de los tres riesgos?`,
    o: [`R2, con VME de $80,000; reserva para contingencias de $175,000.`,
        `R1, con VME de $35,000, por tener la mayor probabilidad; reserva para contingencias de $175,000.`,
        `R2, con VME de $80,000; reserva para contingencias de $570,000, que es la suma de los impactos.`],
    e: `VME = probabilidad × impacto: R1 = 35,000; R2 = 80,000; R3 = 60,000. La suma es 175,000. Sumar los impactos (570,000) ignora la probabilidad, y la probabilidad por sí sola no determina la prioridad.` },
  { a: 1, c: 'D', q: `Para atender la migración, el equipo del proyecto crece de 12 a 16 personas, incluido el gerente. Con la fórmula de canales de comunicación n(n − 1) ÷ 2, ¿cuántos canales habrá y cuántos más que antes?`,
    o: [`120 canales en total, 54 más que con 12 personas.`,
        `240 canales en total, 174 más que con 12 personas.`,
        `136 canales en total, 58 más que con 12 personas.`],
    e: `Con 12 personas: 12 × 11 ÷ 2 = 66. Con 16: 16 × 15 ÷ 2 = 120. Diferencia: 54. Olvidar dividir entre 2 da 240 y usar n(n + 1) ÷ 2 da 136.` },
  { a: 1, q: `En el control de calidad de un proceso de carga de datos, el diagrama de control muestra siete puntos consecutivos por encima de la línea central, aunque todos quedan dentro de los límites superior e inferior de control. ¿Cómo debe interpretarse?`,
    o: [`Hay una tendencia no aleatoria (regla de los siete puntos) que sugiere una causa asignable, aunque ningún punto salió de los límites; debe investigarse.`,
        `El proceso está bajo control, porque ningún punto excede los límites superior o inferior de control.`,
        `El proceso incumple las especificaciones del cliente, porque siete puntos consecutivos superan el valor promedio.`],
    e: `Siete puntos consecutivos del mismo lado de la línea central indican un patrón no aleatorio y una posible causa asignable. Además, los límites de control no son los límites de especificación del cliente.` },
  { a: 1, q: `Una matriz RACI del proyecto contiene estas filas (R = ejecuta, A = responsable último, C = consultado, I = informado):
<div class="tw"><table><thead><tr><th>Actividad</th><th>Gerente</th><th>Analista</th><th>DBA</th><th>QA</th></tr></thead><tbody><tr><td>Modelo de datos</td><td>A</td><td>C</td><td>R</td><td>I</td></tr><tr><td>Plan de pruebas</td><td>A</td><td>I</td><td>I</td><td>A</td></tr></tbody></table></div>
¿Qué defecto presenta la fila «Plan de pruebas»?`,
    o: [`Tiene dos responsables últimos (A) y ningún ejecutor (R); debe haber un solo A y al menos un R.`,
        `Tiene dos ejecutores (R) y ningún responsable último (A); debe haber un solo R y al menos un A.`,
        `Tiene un consultado (C) y un informado (I) de más; la matriz debe asignar solo A y R por actividad.`],
    e: `En una RACI cada actividad debe tener exactamente un A y al menos un R. La fila marca dos A (Gerente y QA) y ningún R. Los consultados e informados son válidos.` },
  { a: 1, q: `Un proyecto tiene las siguientes actividades:
<div class="tw"><table><thead><tr><th>Actividad</th><th>Duración (días)</th><th>Predecesora</th><th>Costo por día de compresión</th><th>Compresión máxima</th></tr></thead><tbody><tr><td>A</td><td>4</td><td>—</td><td>$300</td><td>1 día</td></tr><tr><td>B</td><td>6</td><td>A</td><td>$100</td><td>2 días</td></tr><tr><td>C</td><td>8</td><td>A</td><td>$500</td><td>2 días</td></tr><tr><td>D</td><td>5</td><td>B y C</td><td>$200</td><td>2 días</td></tr><tr><td>E</td><td>3</td><td>D</td><td>$400</td><td>1 día</td></tr></tbody></table></div>
El proyecto debe acortarse 2 días con el menor costo adicional. ¿Qué decisión es la correcta?`,
    o: [`Comprimir D dos días: costo adicional de $400 y duración final de 18 días.`,
        `Comprimir B dos días: costo adicional de $200 y duración final de 18 días.`,
        `Comprimir A un día y C un día: costo adicional de $800 y duración final de 18 días.`],
    e: `La ruta crítica es A-C-D-E = 4 + 8 + 5 + 3 = 20 días (A-B-D-E dura 18). Comprimir B no acorta el proyecto porque no es crítica. Comprimir D dos días cuesta 400 y lo lleva a 18 días; la tercera opción también cumple pero cuesta 800.` },
  { a: 1, q: `El alcance de un proyecto incluye análisis, diseño, construcción, pruebas, capacitación y gestión del proyecto. El soporte posterior a la entrega por 12 meses se contratará aparte y no forma parte del proyecto. ¿Qué primer nivel de la EDT cumple con la regla del 100 %?`,
    o: [`Análisis, diseño, construcción, pruebas, capacitación y gestión del proyecto.`,
        `Análisis, diseño, construcción, capacitación y gestión del proyecto.`,
        `Análisis, diseño, construcción, pruebas, capacitación, gestión del proyecto y soporte posterior por 12 meses.`],
    e: `La regla del 100 % exige que la EDT incluya todo el trabajo del alcance y nada más. La segunda opción omite las pruebas y la tercera incluye trabajo fuera del alcance.` },
 
  { a: 2, c: 'A', q: `La dirección quiere conocer a los clientes que nunca han realizado un pedido. ¿Qué consulta lo obtiene?`,
    o: [`<code>SELECT c.nombre FROM cliente c LEFT JOIN pedido p ON p.id_cliente = c.id_cliente WHERE p.id_pedido IS NULL;</code>`,
        `<code>SELECT c.nombre FROM cliente c LEFT JOIN pedido p ON p.id_cliente = c.id_cliente WHERE p.id_cliente = NULL;</code>`,
        `<code>SELECT c.nombre FROM cliente c INNER JOIN pedido p ON p.id_cliente = c.id_cliente WHERE p.id_pedido IS NULL;</code>`],
    e: `El LEFT JOIN conserva a todos los clientes y deja nulos los campos de pedido cuando no hay coincidencia; se detectan con IS NULL. Comparar con «= NULL» nunca es verdadero, y un INNER JOIN no conserva a los clientes sin pedidos.` },
  { a: 2, c: 'A', q: `¿Qué consulta calcula las ventas totales por ciudad, solo de pedidos entregados en 2026, y muestra únicamente las ciudades con más de $500,000?`,
    o: [`<code>SELECT c.ciudad, SUM(d.cantidad * d.precio_unitario) FROM cliente c JOIN pedido p ON p.id_cliente = c.id_cliente JOIN detalle_pedido d ON d.id_pedido = p.id_pedido WHERE p.estatus = 'Entregado' AND p.fecha &gt;= '2026-01-01' AND p.fecha &lt; '2027-01-01' GROUP BY c.ciudad HAVING SUM(d.cantidad * d.precio_unitario) &gt; 500000;</code>`,
        `<code>SELECT c.ciudad, SUM(d.cantidad * d.precio_unitario) FROM cliente c JOIN pedido p ON p.id_cliente = c.id_cliente JOIN detalle_pedido d ON d.id_pedido = p.id_pedido WHERE p.estatus = 'Entregado' AND p.fecha &gt;= '2026-01-01' AND p.fecha &lt; '2027-01-01' GROUP BY c.ciudad, c.nombre HAVING SUM(d.cantidad * d.precio_unitario) &gt; 500000;</code>`,
        `<code>SELECT c.ciudad, SUM(d.precio_unitario) FROM cliente c JOIN pedido p ON p.id_cliente = c.id_cliente JOIN detalle_pedido d ON d.id_pedido = p.id_pedido WHERE p.estatus = 'Entregado' AND p.fecha &gt;= '2026-01-01' AND p.fecha &lt; '2027-01-01' GROUP BY c.ciudad HAVING SUM(d.precio_unitario) &gt; 500000;</code>`],
    e: `El importe de cada renglón es cantidad × precio_unitario, y para totalizar por ciudad se agrupa solo por ciudad. Agrupar además por nombre da totales por cliente, y sumar solo el precio ignora las cantidades.` },
  { a: 2, c: 'A', q: `Una consulta del reporte diario tarda más de tres minutos: <code>SELECT * FROM pedido WHERE YEAR(fecha) = 2026 AND estatus = 'Entregado';</code> Existe un índice sobre la columna fecha y el plan de ejecución muestra un recorrido completo de la tabla. ¿Qué acción corrige la causa?`,
    o: [`Reescribir el filtro como un rango (<code>fecha &gt;= '2026-01-01' AND fecha &lt; '2027-01-01'</code>) para que el optimizador pueda usar el índice, de preferencia con un índice compuesto (estatus, fecha).`,
        `Crear un segundo índice idéntico sobre la columna fecha para que el optimizador cuente con dos alternativas de acceso.`,
        `Particionar la tabla por estatus y conservar el filtro con YEAR(fecha), porque la función se evalúa una sola vez por partición.`],
    e: `Aplicar una función a la columna (YEAR(fecha)) impide usar el índice sobre esa columna. Reescribir el predicado como rango lo hace utilizable. Duplicar índices no cambia el predicado, y el particionamiento por estatus no elimina la función.` },
  { a: 2, c: 'A', q: `Cancelar un pedido requiere dos operaciones: cambiar su estatus a «Cancelado» y devolver a <code>producto.existencia</code> las cantidades del pedido. Si el servidor falla entre ambas operaciones, el estatus y las existencias quedarían inconsistentes. ¿Cómo debe implementarse?`,
    o: [`Ejecutar ambas actualizaciones dentro de una transacción (BEGIN ... COMMIT) y revertirla (ROLLBACK) si ocurre un error, para garantizar la atomicidad.`,
        `Ejecutar ambas actualizaciones con confirmación automática y registrar los errores en una bitácora para corregirlos manualmente.`,
        `Ejecutar cada actualización en una sesión distinta para reducir el tiempo de bloqueo de cada tabla.`],
    e: `La atomicidad (la A de ACID) garantiza que ambas operaciones se confirmen juntas o ninguna. La confirmación automática y las sesiones separadas permiten estados intermedios inconsistentes.` },
  { a: 2, c: 'B', q: `¿Qué asignación VLSM del bloque 10.20.0.0/22 es válida, sin traslapes y con capacidad suficiente?`,
    o: [`Administrativos 10.20.0.0/24; Docentes 10.20.1.0/25; Laboratorios 10.20.1.128/26; Enlace 10.20.1.192/30.`,
        `Administrativos 10.20.0.0/24; Docentes 10.20.1.0/25; Laboratorios 10.20.1.64/26; Enlace 10.20.1.192/30.`,
        `Administrativos 10.20.0.0/25; Docentes 10.20.0.128/25; Laboratorios 10.20.1.0/26; Enlace 10.20.1.64/30.`],
    e: `Un /24 ofrece 254 equipos (≥ 200), un /25 ofrece 126 (≥ 100), un /26 ofrece 62 (≥ 50) y un /30 ofrece 2. En la segunda opción 10.20.1.64/26 cae dentro de 10.20.1.0/25 (traslape). En la tercera, el /25 de Administrativos solo da 126 equipos, insuficiente para 200.` },
  { a: 2, c: 'B', q: `Un equipo de Docentes no logra comunicarse con el servidor 10.20.0.50. Su configuración es: dirección 10.20.1.140, máscara 255.255.255.128 y puerta de enlace 10.20.1.1. ¿Cuál es la causa más probable?`,
    o: [`La dirección 10.20.1.140 queda fuera de la subred 10.20.1.0/25 (10.20.1.0 a 10.20.1.127), a la que pertenece la puerta de enlace 10.20.1.1; el equipo no puede alcanzarla.`,
        `La dirección 10.20.1.140 coincide con la dirección de difusión de la subred de Docentes, por lo que el router descarta el tráfico.`,
        `El servidor 10.20.0.50 está en una subred /24 y el router solo puede enrutar entre subredes que tengan la misma longitud de máscara.`],
    e: `Con máscara /25, el equipo pertenece a 10.20.1.128/25, mientras que la puerta de enlace 10.20.1.1 está en 10.20.1.0/25: no están en la misma red, así que no puede enviarle tráfico. La difusión de 10.20.1.0/25 es .127, y los routers sí enrutan subredes de distinta longitud (VLSM).` },
  { a: 2, c: 'B', q: `Los equipos de la VLAN 10 se comunican entre los dos switches, pero los de la VLAN 20 de SW1 no alcanzan a los de la VLAN 20 de SW2. La salida de los comandos de verificación es:
<pre>SW1# show interfaces trunk
Port    Mode  Native vlan  Vlans allowed on trunk
Gi0/24  on    1            10

SW2# show interfaces trunk
Port    Mode  Native vlan  Vlans allowed on trunk
Gi0/24  on    1            10,20</pre>
¿Qué corrección procede?`,
    o: [`Permitir la VLAN 20 en el enlace troncal Gi0/24 de SW1, para que coincida con SW2.`,
        `Cambiar el puerto Gi0/24 de SW2 a modo de acceso en la VLAN 20.`,
        `Crear una interfaz virtual (SVI) para la VLAN 20 en SW2, para enrutar el tráfico hacia SW1.`],
    e: `SW1 solo permite la VLAN 10 en el troncal, por lo que las tramas de la VLAN 20 no cruzan el enlace. Convertir el puerto en acceso rompería la VLAN 10, y una SVI enruta entre VLAN pero no extiende una VLAN entre switches.` },
  { a: 2, c: 'B', q: `En el firewall debe permitirse que únicamente los docentes (10.20.1.0/25) consulten el servidor de expedientes 10.20.0.50 por HTTPS (TCP 443), y bloquearse cualquier otro tráfico hacia ese servidor. El firewall evalúa las reglas en orden y aplica la primera que coincida. ¿Qué conjunto de reglas cumple lo requerido?`,
    o: [`Regla 1: permitir TCP 443 desde 10.20.1.0/25 hacia 10.20.0.50. Regla 2: denegar cualquier otro tráfico hacia 10.20.0.50.`,
        `Regla 1: denegar cualquier tráfico hacia 10.20.0.50. Regla 2: permitir TCP 443 desde 10.20.1.0/25 hacia 10.20.0.50.`,
        `Regla 1: permitir TCP 443 desde 10.20.1.0/25 hacia 10.20.0.0/24. Regla 2: denegar cualquier otro tráfico hacia 10.20.0.50.`],
    e: `Como se aplica la primera coincidencia, la regla específica de permiso debe ir antes que la denegación general. En la segunda opción la denegación bloquea todo, incluido el tráfico permitido, y la tercera permite acceso a toda la subred 10.20.0.0/24, más de lo requerido.` },
  { a: 2, c: 'C', q: `¿Qué estrategia es la más adecuada para resolver los problemas de despliegue y de saturación sin detener la operación?`,
    o: [`Extraer gradualmente el módulo de rastreo como un servicio independiente, mientras el monolito sigue operando con el resto de los módulos.`,
        `Reescribir toda la plataforma como microservicios y cambiar de sistema en una sola fecha de corte.`,
        `Aumentar la capacidad del servidor del monolito (escalamiento vertical) para absorber los picos del módulo de rastreo.`],
    e: `La migración incremental (patrón estrangulador) aísla primero el módulo problemático, permite desplegarlo y escalarlo por separado y no detiene la operación. La reescritura total con corte único es de alto riesgo y el escalamiento vertical no resuelve el acoplamiento ni los despliegues completos.` },
  { a: 2, c: 'C', q: `El módulo de pagos debe integrar varios proveedores, y se agregarán nuevos con frecuencia. ¿Qué diseño permite hacerlo sin modificar el código ya probado?`,
    o: [`Definir una interfaz común de proveedor de pago e implementar una clase por proveedor (patrón Strategy), de modo que los nuevos se agreguen sin modificar el código existente.`,
        `Mantener una sola clase de pagos con una estructura condicional (if/else) por proveedor, agregando una rama por cada nuevo proveedor.`,
        `Copiar el módulo de pagos para cada proveedor y mantener versiones independientes del código duplicado.`],
    e: `Una interfaz con una implementación por proveedor cumple el principio abierto/cerrado: se extiende sin modificar lo existente. Las ramas condicionales obligan a modificar código probado y la duplicación multiplica el mantenimiento.` },
  { a: 2, c: 'C', q: `Cuando se confirma un pedido, el servicio de pedidos debe avisar a facturación. Si facturación está caída unos minutos, no debe perderse ningún aviso ni detenerse la confirmación de pedidos. ¿Qué mecanismo de integración conviene?`,
    o: [`Publicar un evento en una cola de mensajes persistente, que facturación consuma cuando esté disponible.`,
        `Invocar el servicio de facturación mediante una llamada síncrona (REST) con un tiempo de espera largo.`,
        `Compartir la base de datos de pedidos para que facturación lea los pedidos nuevos cuando le convenga.`],
    e: `La mensajería asíncrona con persistencia desacopla ambos servicios y evita pérdidas mientras el consumidor no está disponible. La llamada síncrona bloquea la confirmación y la base compartida acopla los servicios.` },
  { a: 2, q: `¿Qué imprime el siguiente programa?
<pre>def f(n):
    total = 0
    for i in range(1, n + 1):
        if i % 3 == 0 or i % 5 == 0:
            total += i
    return total

print(f(10))</pre>`,
    o: [`33`, `23`, `18`],
    e: `Entre 1 y 10, los múltiplos de 3 o de 5 son 3, 5, 6, 9 y 10; su suma es 33. Excluir el 10 daría 23 (error por usar range(1, n)), y considerar solo múltiplos de 3 daría 18.` },
  { a: 2, q: `El campo «edad» de un formulario acepta valores enteros de 18 a 65. Al aplicar la técnica de análisis de valores límite, ¿qué valores deben probarse?`,
    o: [`17, 18, 65 y 66.`,
        `18, 41 y 65.`,
        `0, 17, 66 y 100.`],
    e: `El análisis de valores límite prueba los valores en el borde del intervalo válido y los inmediatamente fuera de él: 17, 18, 65 y 66. Un valor central (41) y los extremos lejanos (0, 100) no verifican los bordes.` },
  { a: 2, q: `La tabla <code>empleado</code> contiene cinco filas:
<div class="tw"><table><thead><tr><th>id</th><th>correo</th><th>salario</th></tr></thead><tbody><tr><td>1</td><td>a@x.mx</td><td>10000</td></tr><tr><td>2</td><td>NULL</td><td>20000</td></tr><tr><td>3</td><td>c@x.mx</td><td>30000</td></tr><tr><td>4</td><td>NULL</td><td>40000</td></tr><tr><td>5</td><td>e@x.mx</td><td>NULL</td></tr></tbody></table></div>
¿Qué resultado devuelve <code>SELECT COUNT(*), COUNT(correo), AVG(salario) FROM empleado;</code>?`,
    o: [`5, 3 y 25000.`, `5, 5 y 20000.`, `5, 3 y 20000.`],
    e: `COUNT(*) cuenta todas las filas (5); COUNT(correo) ignora los NULL (3); AVG(salario) ignora el NULL y promedia 10000, 20000, 30000 y 40000 (25000), no 100000 ÷ 5.` },
  { a: 2, q: `Un usuario puede hacer ping a 8.8.8.8 con éxito, pero <code>ping www.ejemplo.com</code> responde «no se pudo encontrar el host». ¿Cuál es la causa más probable?`,
    o: [`Falla en la resolución de nombres: el servidor DNS configurado es incorrecto o está inalcanzable.`,
        `La puerta de enlace predeterminada es incorrecta, por lo que el equipo no puede salir a Internet.`,
        `La máscara de subred es incorrecta, por lo que el equipo no puede comunicarse con ningún destino.`],
    e: `Si hay conectividad por dirección IP hacia Internet, la puerta de enlace y la máscara funcionan. Lo que falla es la traducción del nombre a dirección, que corresponde al DNS.` },
 
  { a: 3, c: 'E', q: `¿En qué orden debe atender la mesa de servicio los cuatro tickets, de mayor a menor prioridad?`,
    o: [`T2, T4, T3, T1.`,
        `T3, T2, T4, T1.`,
        `T2, T3, T4, T1.`],
    e: `Con la matriz: T2 (impacto alto, urgencia alta) = P1; T4 (medio, alta) = P2; T3 (bajo, alta) = P3; T1 (bajo, baja) = P4. La urgencia alta de un solo usuario no supera al impacto: el directivo queda en P3.` },
  { a: 3, c: 'E', q: `Suponga que el ticket T2 se registró un viernes a las 17:30. De acuerdo con su prioridad y con el horario de la mesa, ¿cuándo vence su plazo de resolución?`,
    o: [`El lunes a las 9:30.`,
        `El viernes a las 21:30.`,
        `El lunes a las 12:00.`],
    e: `T2 es P1 (4 horas hábiles). El viernes quedan 2.5 horas (17:30 a 20:00). Faltan 1.5 horas, que se cumplen el lunes a las 9:30. El viernes a las 21:30 cuenta horas naturales y el lunes a las 12:00 reinicia el conteo.` },
  { a: 3, c: 'E', q: `El ticket T2 lleva tres horas hábiles abierto, está asignado a un especialista de segundo nivel que aún no tiene un diagnóstico y el SLA vence en una hora. ¿Qué debe hacerse?`,
    o: [`Aplicar un escalamiento jerárquico: notificar al gerente de servicio, activar el proceso de incidente mayor, mantener al especialista trabajando y comunicar el estado a los usuarios.`,
        `Cerrar el ticket y abrir uno nuevo de problema para detener el conteo del SLA mientras se investiga la causa raíz.`,
        `Reasignar el ticket a otro especialista de segundo nivel para reiniciar el tiempo de resolución.`],
    e: `Ante el riesgo de incumplir el SLA de un incidente crítico, procede el escalamiento jerárquico y la gestión como incidente mayor, con comunicación a los afectados. Cerrar el ticket o reasignarlo para reiniciar el conteo manipula la medición y no restablece el servicio.` },
  { a: 3, c: 'E', q: `En el mes, la mesa recibió 600 tickets. Se resolvieron 420 en el primer contacto, pero 30 de ellos fueron reabiertos porque el problema persistía. Si la organización define la resolución en el primer contacto (FCR) como los tickets resueltos en el primer contacto y que no fueron reabiertos, ¿cuál es el FCR del mes?`,
    o: [`65 %: 390 de 600 tickets.`,
        `70 %: 420 de 600 tickets.`,
        `92.9 %: 390 de 420 tickets.`],
    e: `Con la definición dada, cuentan 420 − 30 = 390 tickets sobre el total recibido (600): 65 %. El 70 % incluye los reabiertos y el 92.9 % calcula la proporción respecto de los resueltos en primer contacto, no del total.` },
  { a: 3, q: `La dirección de una empresa fijó la meta empresarial «ofrecer una cultura de servicio orientada al cliente» y desea aplicar COBIT 2019. De acuerdo con la cascada de metas, ¿cuál es el siguiente paso?`,
    o: [`Traducir la meta empresarial en metas de alineación de TI y, a partir de ellas, seleccionar los objetivos de gobierno y gestión relevantes.`,
        `Seleccionar directamente los procesos equivalentes de ITIL y medirlos con los indicadores del SLA.`,
        `Asignar a cada gerente los objetivos de gestión del dominio DSS y derivar después la meta empresarial.`],
    e: `La cascada de metas de COBIT va de las metas empresariales a las metas de alineación y de estas a los objetivos de gobierno y gestión. No parte de procesos de otro marco ni invierte el sentido.` },
  { a: 3, q: `En una evaluación de capacidad de procesos de COBIT 2019, el proceso de gestión de incidentes de una empresa está documentado y estandarizado, con plantillas, roles y un procedimiento que se aplica de forma uniforme en todas las áreas de TI, pero aún no se mide con métricas cuantitativas. ¿Qué nivel de capacidad tiene?`,
    o: [`Nivel 3 (definido): el proceso se ejecuta con un procedimiento estándar de la organización.`,
        `Nivel 2 (gestionado): el proceso se planifica y monitorea, pero cada área puede ejecutarlo de forma distinta.`,
        `Nivel 4 (medible): el proceso se mide y controla con métricas cuantitativas.`],
    e: `El proceso estandarizado en toda la organización corresponde al nivel 3. El nivel 2 se centra en planificar, monitorear y ajustar sin un estándar común, y el nivel 4 exige medición cuantitativa, que el caso descarta.` },
  { a: 3, q: `Antes de actualizar un servidor de base de datos, el comité de cambios pregunta qué servicios del negocio dependen de él. ¿Qué fuente de información de ITIL debe consultarse?`,
    o: [`La base de datos de gestión de la configuración (CMDB), que registra los elementos de configuración y sus relaciones con los servicios.`,
        `La base de conocimiento, que almacena soluciones, errores conocidos y artículos de ayuda para los usuarios.`,
        `El catálogo de servicios, que describe los servicios que se ofrecen a los clientes y sus condiciones.`],
    e: `Para evaluar el impacto de un cambio se necesitan las relaciones entre elementos de configuración y servicios, que se almacenan en la CMDB. La base de conocimiento y el catálogo no registran dependencias técnicas.` },
  { a: 3, q: `Se detecta una vulnerabilidad crítica que ya está siendo explotada activamente contra los servidores web de la empresa, y el parche debe aplicarse hoy. ¿Cómo debe clasificarse y tramitarse el cambio en ITIL?`,
    o: [`Cambio de emergencia: autorización acelerada por un comité de emergencia (ECAB), implementación inmediata y revisión posterior.`,
        `Cambio estándar: preautorizado, de bajo riesgo y con procedimiento conocido, aplicado sin evaluación adicional.`,
        `Cambio normal: evaluado y autorizado por el comité de cambios en su siguiente reunión semanal programada.`],
    e: `Una amenaza activa que exige acción el mismo día es un cambio de emergencia, con aprobación acelerada y revisión posterior. Un cambio estándar no aplica a una situación crítica no rutinaria y esperar la reunión semanal prolongaría la exposición.` }
];

const KEY = 'egel-simulacro-avanzado-v1';
const app = document.getElementById('app');
const hdr = document.getElementById('hdr');
const toastEl = document.getElementById('toast');
const LET = ['A', 'B', 'C'];
let S = null;
let view = 'welcome'; // welcome | quiz | results
let confirmMode = null; // finish | restart | null
const warned = {};

const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const loadSaved = () => { try { const r = JSON.parse(localStorage.getItem(KEY)); return r && r.perms && r.perms.length === Q.length ? r : null; } catch (e) { return null; } };
const answered = () => S.answers.filter(a => a !== null).length;
const fmt = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const toTop = () => { try { window.scrollTo(0, 0); } catch (e) {} };
const remaining = () => S.endsAt - Date.now();

function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { toastEl.hidden = true; }, 6000);
}

function newAttempt(name) {
  const now = Date.now();
  S = { name, perms: Q.map(() => shuffle([0, 1, 2])), answers: Q.map(() => null), flags: Q.map(() => false), idx: 0,
        finished: false, timeUp: false, startedAt: now, endsAt: now + TOTAL_MIN * 60000, finishedAt: null };
  Object.keys(warned).forEach(k => delete warned[k]);
  confirmMode = null; view = 'quiz'; save(); render(); toTop();
}

function finish(timeUp) {
  S.finished = true; S.timeUp = !!timeUp; S.finishedAt = Math.min(Date.now(), S.endsAt);
  confirmMode = null; view = 'results'; save(); render(); toTop();
}

function tick() {
  if (view !== 'quiz' || !S || S.finished) return;
  const r = remaining();
  if (r <= 0) { toast('Se agotó el tiempo. Se muestran tus resultados.'); finish(true); return; }
  const c = document.getElementById('clock');
  if (c) { c.textContent = fmt(r); c.classList.toggle('low', r <= 10 * 60000); }
  [[600000, 'Quedan 10 minutos.'], [300000, 'Quedan 5 minutos.'], [60000, 'Queda 1 minuto. Revisa las preguntas sin responder.']].forEach(([t, m]) => {
    if (r <= t && !warned[t]) { warned[t] = true; if (r > t - 5000) toast(m); }
  });
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', tick);

function renderHeader() {
  if (view === 'quiz' && S) {
    hdr.innerHTML = '<div class="hl"><strong>EGEL Informática · Avanzado</strong><span>' + esc(S.name) + '</span></div>' +
      '<div class="hr"><span class="cnt">' + answered() + '/' + Q.length + '</span><span class="clock' + (remaining() <= 600000 ? ' low' : '') + '" id="clock" role="timer" aria-label="Tiempo restante">' + fmt(remaining()) + '</span></div>';
  } else if (view === 'results' && S) {
    hdr.innerHTML = '<div class="hl"><strong>EGEL Informática · Avanzado</strong><span>Resultados de ' + esc(S.name) + '</span></div>';
  } else {
    hdr.innerHTML = '<div class="hl"><strong>EGEL Informática · Avanzado</strong><span>80 minutos</span></div>';
  }
}

function render() {
  renderHeader();
  if (view === 'welcome') return renderWelcome();
  if (view === 'quiz') return renderQuiz();
  renderResults();
}

function renderWelcome() {
  const saved = loadSaved();
  const counts = AREAS.map((a, i) => Q.filter(q => q.a === i).length);
  const facts = '<div class="fact"><b>' + Q.length + '</b><span>reactivos</span></div><div class="fact"><b>' + TOTAL_MIN + '</b><span>minutos</span></div>' +
    AREAS.map((a, i) => '<div class="fact"><b>' + counts[i] + '</b><span>' + esc(a.short) + '</span></div>').join('');
  let resume = '';
  if (saved) {
    const n = saved.answers.filter(a => a !== null).length;
    const left = saved.endsAt - Date.now();
    const state = saved.finished ? 'terminado' : left > 0 ? 'en curso, con ' + fmt(left) + ' restantes' : 'con el tiempo agotado';
    resume = '<div class="resume"><p>Hay un intento ' + state + ' de <strong>' + esc(saved.name) + '</strong> (' + n + ' de ' + Q.length + ' respondidas).</p>' +
      '<div class="row"><button class="btn primary" data-a="resume">' + (saved.finished || left <= 0 ? 'Ver resultados' : 'Continuar') + '</button></div></div>';
  }
  app.innerHTML = '<section class="card hero"><h1>Simulacro EGEL Informática Avanzado</h1>' +
    '<p class="lead">Examen de práctica. Lee cuidadosamente cada cuestionamiento.</p>' +
    '<div class="facts">' + facts + '</div>' +
    '<ul class="rules"><li>El cronómetro de 80 minutos empieza al comenzar y no se pausa. Al terminar el tiempo, el examen se cierra solo.</li>' +
    '<li>Puedes volver a cualquier pregunta y marcarla para revisar.</li><li>Al final verás aciertos por área y solo las preguntas que fallaste, con su explicación.</li></ul>' +
    resume +
    '<form class="field" id="nameForm" autocomplete="off"><label for="nameInput">¿Cómo te llamas?</label>' +
    '<input id="nameInput" type="text" maxlength="60" placeholder="Nombre y apellido" value="' + esc(saved ? saved.name : '') + '">' +
    '<div class="row" style="margin-top:8px"><button class="btn primary" id="startBtn" type="submit">' + (saved ? 'Iniciar nuevo simulacro' : 'Comenzar simulacro') + '</button></div></form></section>';
  const inp = document.getElementById('nameInput'), btn = document.getElementById('startBtn');
  const sync = () => { btn.disabled = !inp.value.trim(); };
  inp.addEventListener('input', sync); sync();
  document.getElementById('nameForm').addEventListener('submit', e => {
    e.preventDefault();
    const n = inp.value.trim();
    if (n) newAttempt(n);
  });
}

function caseHtml(c) {
  const k = CASES[c];
  return '<aside class="case" aria-label="Caso"><span class="ct">Lee el caso · ' + esc(k.t) + '</span>' + k.p.map(p => /^<(pre|div|table)/.test(p) ? p : '<p>' + p + '</p>').join('') + '</aside>';
}
function casePos(i) {
  const c = Q[i].c; if (!c) return '';
  const ids = Q.map((q, k) => q.c === c ? k : -1).filter(k => k >= 0);
  return 'Pregunta ' + (ids.indexOf(i) + 1) + ' de ' + ids.length + ' del caso';
}

function renderQuiz() {
  const i = S.idx, q = Q[i], ar = AREAS[q.a], done = answered(), pct = Math.round(done / Q.length * 100);
  const opts = [0, 1, 2].map(k => '<button class="opt" role="radio" aria-checked="' + (S.answers[i] === S.perms[i][k]) + '" data-a="pick" data-k="' + k + '">' +
    '<span class="ltr">' + LET[k] + '</span><span class="txt">' + q.o[S.perms[i][k]] + '</span></button>').join('');

  let bar = '';
  if (confirmMode === 'finish') {
    const left = Q.length - done;
    bar = '<div class="confirm" role="alert"><p>' + (left ? 'Te faltan <strong>' + left + '</strong> pregunta' + (left > 1 ? 's' : '') + ' por responder y contarán como incorrectas. ' : '') +
      'Te quedan ' + fmt(remaining()) + ' minutos. ¿Terminar el examen y ver los resultados?</p>' +
      '<div class="row"><button class="btn primary" data-a="finish">Sí, terminar</button><button class="btn" data-a="cancel">Seguir respondiendo</button></div></div>';
  } else if (confirmMode === 'restart') {
    bar = '<div class="confirm" role="alert"><p>Se borrarán tus respuestas, el cronómetro volverá a 80:00 y las opciones se mezclarán de nuevo. ¿Iniciar de nuevo?</p>' +
      '<div class="row"><button class="btn dark" data-a="restart">Sí, iniciar de nuevo</button><button class="btn" data-a="cancel">Cancelar</button></div></div>';
  }

  const map = AREAS.map((a, ai) => {
    const dots = Q.map((x, qi) => x.a === ai ? '<button class="dot' + (S.answers[qi] !== null ? ' done' : '') + (S.flags[qi] ? ' fl' : '') + (qi === i ? ' cur' : '') + '" data-a="go" data-i="' + qi + '" aria-label="Pregunta ' + (qi + 1) + (S.answers[qi] !== null ? ', respondida' : ', sin responder') + (S.flags[qi] ? ', marcada para revisar' : '') + '"' + (qi === i ? ' aria-current="true"' : '') + '>' + (qi + 1) + '</button>' : '').join('');
    return '<div class="maprow"><span class="lab">Área ' + (ai + 1) + ' · ' + esc(a.short) + '</span><div class="dots">' + dots + '</div></div>';
  }).join('');

  app.innerHTML = '<div style="display:flex;flex-direction:column;gap:16px">' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + Q.length + '" aria-valuenow="' + done + '" aria-label="Preguntas respondidas"><i style="width:' + pct + '%"></i></div>' +
    '<section class="card" aria-live="polite"><div class="qhead"><span class="chip o">Área ' + (q.a + 1) + ' · ' + esc(ar.name) + '</span><span class="qnum">Pregunta ' + (i + 1) + ' de ' + Q.length + (q.c ? ' · ' + casePos(i) : '') + '</span></div>' +
    (q.c ? caseHtml(q.c) : '') +
    '<div class="qtext">' + q.q + '</div><div class="opts" role="radiogroup" aria-label="Opciones de respuesta">' + opts + '</div>' +
    '<div class="row" style="margin-top:18px"><button class="flag" data-a="flag" aria-pressed="' + S.flags[i] + '"><i></i>' + (S.flags[i] ? 'Marcada para revisar' : 'Marcar para revisar') + '</button></div></section>' +
    '<div class="row between"><button class="btn" data-a="prev"' + (i === 0 ? ' disabled' : '') + '>← Anterior</button>' +
    '<button class="btn" data-a="next"' + (i === Q.length - 1 ? ' disabled' : '') + '>Siguiente →</button></div>' +
    bar +
    '<section class="card map"><h3>Mapa de preguntas</h3>' + map +
    '<div class="legend"><span>Sin responder</span><span class="l1">Respondida</span><span class="l2">Pregunta actual</span></div></section>' +
    '<div class="row between"><button class="btn" data-a="askRestart">Iniciar de nuevo</button><button class="btn primary" data-a="askFinish">Terminar examen</button></div></div>';
}

function results() {
  const ok = AREAS.map(() => 0), tot = AREAS.map(() => 0), wrong = [];
  Q.forEach((q, i) => { tot[q.a]++; if (S.answers[i] === 0) ok[q.a]++; else wrong.push(i); });
  return { ok, tot, wrong, total: ok.reduce((a, b) => a + b, 0) };
}
function level(p) { return p >= 70 ? ['good', 'Sólido'] : p >= 50 ? ['mid', 'En desarrollo'] : ['low', 'Por reforzar']; }

function renderResults() {
  const r = results(), pct = Math.round(r.total / Q.length * 100);
  const used = Math.min(S.finishedAt - S.startedAt, TOTAL_MIN * 60000);
  const rows = AREAS.map((a, ai) => {
    const p = Math.round(r.ok[ai] / r.tot[ai] * 100), l = level(p);
    return '<tr><td>Área ' + (ai + 1) + ' · ' + esc(a.name) + '</td><td class="num">' + r.ok[ai] + '</td><td class="num">' + r.tot[ai] + '</td><td class="num">' + p + ' %</td>' +
      '<td><span class="meter" aria-hidden="true"><i style="width:' + p + '%"></i></span></td><td><span class="lvl ' + l[0] + '">' + l[1] + '</span></td></tr>';
  }).join('');
  const tl = level(pct);
  const table = '<div class="tablewrap"><table><thead><tr><th>Área</th><th class="num">Correctas</th><th class="num">Reactivos</th><th class="num">Porcentaje</th><th></th><th>Nivel</th></tr></thead><tbody>' + rows +
    '<tr class="total"><td>Total</td><td class="num">' + r.total + '</td><td class="num">' + Q.length + '</td><td class="num">' + pct + ' %</td><td></td><td><span class="lvl ' + tl[0] + '">' + tl[1] + '</span></td></tr></tbody></table></div>' +
    '<p class="note">Nivel de referencia para estudio: Sólido desde 70 %, En desarrollo de 50 a 69 %, Por reforzar por debajo de 50 %. No equivale al puntaje oficial del CENEVAL.</p>';

  let review;
  if (!r.wrong.length) {
    review = '<div class="card empty">Respondiste todo correctamente, ' + esc(S.name) + '. No hay preguntas para repasar.</div>';
  } else {
    review = r.wrong.map(i => {
      const q = Q[i], mine = S.answers[i];
      return '<article class="card rcard"><div class="qhead"><span class="chip o">Área ' + (q.a + 1) + ' · ' + esc(AREAS[q.a].name) + '</span><span class="qnum">Pregunta ' + (i + 1) + '</span></div>' +
        (q.c ? '<details class="dcase"><summary>Leer de nuevo el caso: ' + esc(CASES[q.c].t) + '</summary>' + caseHtml(q.c) + '</details>' : '') +
        '<div class="qtext">' + q.q + '</div>' +
        '<div class="ans bad"><span class="tag">Tu respuesta</span><span>' + (mine === null ? 'Sin responder' : q.o[mine]) + '</span></div>' +
        '<div class="ans good"><span class="tag">Correcta</span><span>' + q.o[0] + '</span></div>' +
        '<p class="why"><b>Por qué:</b> ' + esc(q.e).replace(/&lt;code&gt;/g, '<code>').replace(/&lt;\/code&gt;/g, '</code>') + '</p></article>';
    }).join('');
  }

  app.innerHTML = '<div style="display:flex;flex-direction:column;gap:16px">' +
    '<section class="card"><p class="qnum">Resultados de ' + esc(S.name) + ' · tiempo usado ' + fmt(used) + ' de ' + TOTAL_MIN + ':00</p>' +
    '<div class="score"><span class="big">' + r.total + ' / ' + Q.length + '</span><span class="pct">' + pct + ' % de aciertos</span></div>' +
    (S.timeUp ? '<p class="banner">Se agotó el tiempo. Las preguntas sin responder cuentan como incorrectas.</p>' : '') + table + '</section>' +
    '<div class="row"><button class="btn primary" data-a="restart">Iniciar de nuevo</button><button class="btn" data-a="rename">Cambiar nombre</button></div>' +
    '<h2 style="font-size:20px;margin-top:8px">Preguntas por repasar (' + r.wrong.length + ')</h2>' +
    '<div class="review">' + review + '</div>' +
    '<div class="row"><button class="btn primary" data-a="restart">Iniciar de nuevo</button></div></div>';
}

function go(n) { S.idx = Math.max(0, Math.min(Q.length - 1, n)); confirmMode = null; save(); render(); toTop(); }

app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a === 'pick') { S.answers[S.idx] = S.perms[S.idx][+b.dataset.k]; save(); render(); }
  else if (a === 'flag') { S.flags[S.idx] = !S.flags[S.idx]; save(); render(); }
  else if (a === 'prev') go(S.idx - 1);
  else if (a === 'next') go(S.idx + 1);
  else if (a === 'go') go(+b.dataset.i);
  else if (a === 'askFinish') { confirmMode = 'finish'; render(); }
  else if (a === 'askRestart') { confirmMode = 'restart'; render(); }
  else if (a === 'cancel') { confirmMode = null; render(); }
  else if (a === 'finish') finish(false);
  else if (a === 'restart') newAttempt(S.name);
  else if (a === 'rename') { view = 'welcome'; render(); toTop(); }
  else if (a === 'resume') {
    S = loadSaved();
    if (S.finished) { view = 'results'; render(); }
    else if (remaining() <= 0) finish(true);
    else { view = 'quiz'; render(); }
    toTop();
  }
});

document.addEventListener('keydown', e => {
  if (view !== 'quiz' || !S || e.target.closest('input') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'ArrowRight') go(S.idx + 1);
  else if (e.key === 'ArrowLeft') go(S.idx - 1);
  else {
    const k = ['a', 'b', 'c'].indexOf(e.key.toLowerCase()), kk = k >= 0 ? k : ['1', '2', '3'].indexOf(e.key);
    if (kk >= 0 && e.key.length === 1) { S.answers[S.idx] = S.perms[S.idx][kk]; save(); render(); }
  }
});

render();
</script>
</body>
</html>
