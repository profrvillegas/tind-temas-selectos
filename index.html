<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulacro EGEL Informática 80</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --ink: #000000;
  --accent: #FF5900;
  --accent-ink: #000000;
  --tint: #FFEEE5;
  --muted: rgba(0, 0, 0, .66);
  --line: rgba(0, 0, 0, .2);
  --track: rgba(0, 0, 0, .1);
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
.wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Barra superior */
.hdr {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: #000; color: #fff; border-radius: 0 0 10px 10px;
  padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.hl { display: flex; flex-direction: column; min-width: 0; }
.hl strong { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.hl span { font-size: 13px; color: rgba(255,255,255,.78); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hr { display: flex; align-items: center; gap: 12px; flex: none; }
.cnt { font-family: var(--font-mono); font-size: 13px; color: rgba(255,255,255,.85); }
.clock { font-family: var(--font-mono); font-size: 22px; font-weight: 600; background: var(--accent); color: #000; padding: 2px 12px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.clock.low { outline: 3px solid #fff; outline-offset: 0; }

.card { background: #fff; border: 1.5px solid #000; border-radius: 10px; padding: 24px; }
.btn { border: 1.5px solid #000; background: #fff; border-radius: 8px; padding: 10px 18px; font-weight: 500; min-height: 44px; }
.btn:hover { background: var(--tint); }
.btn.primary { background: var(--accent); border-color: #000; color: #000; font-weight: 600; }
.btn.primary:hover { background: #E84F00; }
.btn.dark { background: #000; color: #fff; }
.btn.dark:hover { background: #222; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn:disabled:hover { background: #fff; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }


.hero { border-top: 8px solid var(--accent); }
.hero h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 600; }
.hero .lead { color: var(--muted); max-width: 62ch; margin-top: 10px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 22px 0; }
.fact { border: 1.5px solid #000; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fact b { font-family: var(--font-mono); font-size: 26px; font-weight: 600; background: linear-gradient(transparent 62%, var(--accent) 62%); align-self: flex-start; }
.fact span { font-size: 14px; }
.rules { margin: 0 0 22px; padding-left: 20px; color: var(--muted); max-width: 66ch; }
.rules li { margin-bottom: 4px; }
.field { display: flex; flex-direction: column; gap: 6px; max-width: 460px; }
.field label { font-weight: 600; }
.field input { font: inherit; color: #000; background: #fff; border: 1.5px solid #000; border-radius: 8px; padding: 11px 14px; min-height: 46px; width: 100%; }
.field input:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
.resume { border: 2px dashed var(--accent); border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }

/* Examen */
.bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.chip { display: inline-block; font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; background: #000; color: #fff; border-radius: 6px; padding: 3px 9px; }
.chip.o { background: var(--accent); color: #000; font-weight: 600; }
.qhead { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.qnum { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.case { background: var(--tint); border-left: 8px solid var(--accent); border-radius: 0 8px 8px 0; padding: 16px 20px; margin-bottom: 20px; font-family: var(--font-read); font-size: 17px; line-height: 1.7; display: flex; flex-direction: column; gap: 10px; }
.case .ct { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.qtext { font-size: 18px; line-height: 1.6; max-width: 72ch; font-weight: 500; }
code { font-family: var(--font-mono); font-size: .88em; background: rgba(0,0,0,.07); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; background: #fff; border: 1.5px solid #000; border-radius: 8px; padding: 14px 16px; }
.opt:hover { background: var(--tint); }
.opt .ltr { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid #000; font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.opt .txt { min-width: 0; overflow-wrap: anywhere; }
.opt[aria-checked="true"] { border-width: 3px; padding: 12.5px 14.5px; background: var(--tint); border-color: var(--accent); }
.opt[aria-checked="true"] .ltr { background: var(--accent); }
.flag { border: 1.5px solid #000; border-radius: 8px; background: #fff; padding: 8px 14px; min-height: 40px; display: inline-flex; gap: 8px; align-items: center; font-size: 14px; }
.flag[aria-pressed="true"] { background: var(--accent); font-weight: 600; }
.flag i { width: 12px; height: 12px; background: currentColor; clip-path: polygon(0 0, 100% 0, 100% 100%); display: inline-block; }

.map { display: flex; flex-direction: column; gap: 14px; }
.map h3 { font-size: 13px; font-family: var(--font-mono); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.maprow { display: flex; flex-direction: column; gap: 6px; }
.maprow .lab { font-size: 13px; font-weight: 600; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { position: relative; width: 38px; height: 38px; border-radius: 6px; border: 1.5px solid #000; background: #fff; font-family: var(--font-mono); font-size: 13px; padding: 0; }
.dot.done { background: #000; color: #fff; }
.dot.cur { outline: 3px solid var(--accent); outline-offset: 2px; background: var(--accent); color: #000; font-weight: 600; }
.dot.fl::after { content: ""; position: absolute; top: -1.5px; right: -1.5px; width: 13px; height: 13px; background: var(--accent); border: 1.5px solid #000; clip-path: polygon(0 0, 100% 0, 100% 100%); }
.dot.done.fl::after { border-color: #fff; }
.legend { font-size: 13px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border: 1.5px solid #000; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: #fff; }
.legend .l1::before { background: #000; } .legend .l2::before { background: var(--accent); }

.confirm { border: 3px solid var(--accent); border-radius: 8px; padding: 14px 16px; background: var(--tint); display: flex; flex-direction: column; gap: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: #000; color: #fff; border-left: 8px solid var(--accent); padding: 12px 18px; border-radius: 8px; z-index: 40; max-width: calc(100vw - 32px); font-weight: 500; }


.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
.score .big { font-family: var(--font-mono); font-size: clamp(40px, 8vw, 64px); font-weight: 600; line-height: 1; background: linear-gradient(transparent 70%, var(--accent) 70%); }
.score .pct { font-size: 18px; color: var(--muted); }
.banner { background: var(--accent); border: 1.5px solid #000; border-radius: 8px; padding: 10px 14px; font-weight: 600; margin-top: 14px; }
.tablewrap { overflow-x: auto; margin-top: 16px; }
table { border-collapse: collapse; width: 100%; min-width: 600px; }
th, td { text-align: left; padding: 11px 12px; border-bottom: 1.5px solid var(--line); vertical-align: middle; }
th { background: #000; color: #fff; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 600; background: var(--tint); border-bottom: none; }
.meter { width: 120px; height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; display: inline-block; vertical-align: middle; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.lvl { font-size: 12px; font-weight: 600; white-space: nowrap; padding: 3px 10px; border-radius: 999px; border: 2px solid #000; font-family: var(--font-mono); }
.lvl.good { background: #000; color: #fff; }
.lvl.mid { background: var(--accent); color: #000; }
.lvl.low { background: #fff; border-color: var(--accent); }
.note { font-size: 13px; color: var(--muted); margin-top: 12px; }
.review { display: flex; flex-direction: column; gap: 14px; }
.rcard { border-left: 8px solid var(--accent); }
details.dcase { margin: 0 0 14px; }
details.dcase summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 6px 0; }
details.dcase .case { margin: 8px 0 0; }
.ans { display: flex; gap: 10px; align-items: flex-start; border-radius: 8px; padding: 10px 12px; margin-top: 10px; border: 1.5px solid #000; }
.ans .tag { flex: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; padding-top: 3px; min-width: 96px; }
.ans.bad { border: 3px solid var(--accent); padding: 8px 10px; }
.ans.good { background: #000; color: #fff; }
.why { margin-top: 12px; font-size: 15px; color: var(--muted); }
.why b { color: #000; }
.empty { text-align: center; padding: 28px 12px; font-weight: 600; }

@media (max-width: 560px) {
  .card { padding: 18px; }
  .qtext { font-size: 17px; }
  .case { font-size: 16px; padding: 14px 16px; }
  .ans { flex-direction: column; gap: 2px; }
  .ans .tag { padding-top: 0; }
  .hl span { display: none; }
  .clock { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<body>
<div class="wrap">
  <header class="hdr" id="hdr"></header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const TOTAL_MIN = 80;
const AREAS = [
  { name: 'Necesidades informáticas de una organización', short: 'Necesidades informáticas' },
  { name: 'Gestión de proyectos informáticos', short: 'Gestión de proyectos' },
  { name: 'Implementación de sistemas de información', short: 'Implementación de sistemas' },
  { name: 'Función informática', short: 'Función informática' }
];

const CASES = {
  A: { t: 'Clínica Santa Aurora', p: [
    `La Clínica Santa Aurora, un hospital privado con tres sedes en Quintana Roo, registra las citas y los expedientes en hojas de cálculo que cada sede mantiene por separado. La facturación se realiza con un programa instalado en una sola computadora de escritorio.`,
    `Los médicos se quejan de que no pueden consultar el expediente de un paciente que fue atendido en otra sede. En el último año se perdieron dos meses de facturación por la falla de un disco duro sin respaldo. Además, la autoridad sanitaria exige que los expedientes clínicos electrónicos conserven un registro de quién los consultó o modificó, y cuándo.`,
    `La dirección cuenta con poco presupuesto para inversión inicial, pero puede pagar una cuota mensual. La clínica no tiene personal que administre servidores ni almacenamiento.`] },
  B: { t: 'Ferretería La Plomada', p: [
    `Ferretería La Plomada tiene 14 sucursales. Para definir el nuevo sistema, el analista entrevistó a tres gerentes. El de compras dijo: «el sistema debe sugerir los pedidos a proveedores automáticamente». El de ventas dijo: «lo más urgente es que el cajero no tenga que capturar dos veces el mismo ticket». El de almacén dijo: «nunca sabemos qué hay realmente en los estantes, porque el sistema dice una cosa y el conteo físico otra».`,
    `Más tarde, el analista observó el trabajo en una sucursal y comprobó que el cajero registra la venta en el punto de venta y, al terminar su turno, vuelve a capturar los artículos vendidos en una hoja de inventario. El inventario del sistema se actualiza una sola vez, al cierre del día. La dirección solo puede financiar una primera fase de tres meses.`] },
  C: { t: 'Portal de trámites del municipio', p: [
    `El municipio de Isla Blanca contrató a una empresa para desarrollar un portal de trámites ciudadanos. En la reunión de arranque, el secretario de Innovación (patrocinador) pidió «un portal donde los ciudadanos hagan trámites y pagos en línea». El gerente del proyecto elaboró con su equipo la estructura de desglose del trabajo (EDT), un cronograma de seis meses y un presupuesto de $2,400,000.`,
    `En el mes tres, el área jurídica informa que, por ley, los trámites deberán firmarse con firma electrónica avanzada, algo que no se consideró. Integrarla requeriría cinco semanas adicionales y $350,000. El presupuesto solo puede ampliarse con la aprobación del comité de finanzas. Además, el director de comunicación social, a quien nadie había identificado como interesado, advierte que bloqueará la publicación del portal si no se incluye una campaña de difusión que él coordine.`] },
  D: { t: 'Aplicación de crédito con Scrum', p: [
    `Una empresa de tecnología financiera desarrolla una aplicación de crédito con Scrum, con sprints de dos semanas. El equipo tiene una velocidad promedio de 30 puntos de historia por sprint. El backlog del producto restante suma 180 puntos y la dirección desea lanzar la aplicación dentro de cinco sprints.`,
    `En el sprint 4, el Product Owner cambió dos veces las prioridades con el sprint ya iniciado y el equipo dejó sin terminar 5 de las 12 historias comprometidas. El Scrum Master también observó que, en las reuniones diarias, se discuten soluciones técnicas durante largos periodos y que los desarrolladores aceptan historias sin criterios de aceptación.`] },
  E: { t: 'Gimnasios Pulso', p: [
    `La cadena de gimnasios Pulso requiere una base de datos relacional para su sistema de membresías. Las reglas del negocio son las siguientes: un socio puede tener varias membresías a lo largo del tiempo, pero solo una vigente a la vez, y debe conservarse el historial de las anteriores. Cada membresía corresponde a un plan (mensual, anual o VIP) con su costo.`,
    `Un socio puede reservar muchas clases y cada clase recibe a muchos socios, hasta un cupo máximo. Cada clase la imparte un instructor en una sucursal. Las tablas principales son: instructor(id, nombre), sucursal(id, nombre), clase(id, id_instructor, id_sucursal, cupo) y reserva(id, id_clase, id_socio).`] },
  F: { t: 'Tienda en línea Café Tulum', p: [
    `Después de liberar la versión 2.3 de la tienda en línea de Café Tulum, el equipo de soporte detectó tres problemas. Primero, un cliente pudo ver el historial de compras de otra persona al cambiar el número en la dirección web, de /pedido?id=1042 a /pedido?id=1043. Segundo, al escribir <code>' OR '1'='1</code> en el campo de búsqueda, el sitio mostró todos los productos, incluidos los descontinuados.`,
    `Tercero, el cálculo de envío gratuito para compras de más de $800, que funcionaba en la versión 2.2, dejó de funcionar. Antes de la liberación, el equipo solo había hecho pruebas funcionales manuales sobre las características nuevas.`] },
  G: { t: 'Aseguradora Peninsular', p: [
    `Aseguradora Peninsular recibe quejas frecuentes de sus agentes: el portal de ventas se cae durante 20 a 40 minutos casi cada semana. La mesa de servicio registra cada caída como incidente y reinicia el servicio. El tiempo promedio de resolución es de 25 minutos, dentro del acuerdo de nivel de servicio (SLA) de 60 minutos. Sin embargo, en el último trimestre se registraron 14 incidentes con el mismo síntoma y los agentes perdieron ventas.`,
    `Una auditoría interna encontró que: (a) nadie es responsable de analizar la causa de los incidentes que se repiten; (b) el desarrollador instala los cambios del portal directamente en producción, sin autorización documentada; y (c) el Comité de TI no recibe indicadores del desempeño de los servicios. El Director General quiere que TI esté alineada con los objetivos del negocio.`] }
};

const Q = [
  /* ===== ÁREA 1: Necesidades informáticas (12) ===== */
  { a: 0, c: 'A', q: `De acuerdo con el caso, ¿cuál es la necesidad informática prioritaria de la clínica?`,
    o: [`Un expediente clínico electrónico centralizado, consultable desde las tres sedes, con respaldo y registro de accesos y modificaciones.`,
        `Un sistema de facturación centralizado, consultable desde las tres sedes, con respaldo y registro de accesos y modificaciones.`,
        `Un expediente clínico electrónico independiente en cada sede, con respaldo diario y registro de accesos y modificaciones.`],
    e: `La queja de los médicos y la exigencia de la autoridad se refieren al expediente clínico consultable entre sedes. La facturación con respaldo es una necesidad real pero secundaria, y un expediente por sede no resuelve la consulta cruzada.` },
  { a: 0, c: 'A', q: `Considerando las restricciones de presupuesto y de personal descritas, ¿qué modelo de adquisición es el más adecuado?`,
    o: [`Software como servicio (SaaS) con cuota mensual, donde el proveedor administra la infraestructura, el almacenamiento y los respaldos.`,
        `Infraestructura como servicio (IaaS) con cuota mensual, donde la clínica instala y administra el sistema operativo, la aplicación y los respaldos.`,
        `Servidores propios en una de las sedes con licencias de pago único, donde un proveedor externo da mantenimiento correctivo cuando se le solicita.`],
    e: `Poco capital inicial, cuota mensual aceptable y ausencia de personal técnico apuntan a SaaS. En IaaS la clínica seguiría administrando sistema operativo y aplicación, y los servidores propios exigen inversión inicial y administración.` },
  { a: 0, c: 'A', q: `¿Qué requerimiento de seguridad responde directamente a la exigencia de la autoridad sanitaria?`,
    o: [`Auditoría: bitácoras de acceso y modificación que registren usuario, fecha, hora y acción realizada sobre cada expediente.`,
        `Autenticación: verificación de la identidad de cada usuario mediante contraseña y segundo factor antes de ingresar al sistema.`,
        `Confidencialidad: cifrado de los expedientes almacenados y de las comunicaciones entre las sedes y el sistema.`],
    e: `La autoridad pide un registro de quién consultó o modificó cada expediente y cuándo: eso es auditoría (bitácoras). Autenticación y cifrado protegen el acceso y los datos, pero no generan ese rastro.` },
  { a: 0, c: 'B', q: `¿Cuál es la causa raíz que explica las tres quejas de los gerentes?`,
    o: [`El punto de venta y el control de inventarios no están integrados, lo que produce doble captura y existencias desactualizadas.`,
        `El área de compras carece de un módulo que sugiera pedidos automáticamente, lo que produce faltantes y existencias desactualizadas.`,
        `Los cajeros no están capacitados para registrar las ventas en el punto de venta, lo que produce doble captura y existencias desactualizadas.`],
    e: `La observación muestra que la venta se captura dos veces y que el inventario se actualiza hasta el cierre: el problema es la falta de integración. La sugerencia de pedidos es un síntoma y el texto no indica falta de capacitación.` },
  { a: 0, c: 'B', q: `Para la primera fase de tres meses, ¿qué requerimiento debe clasificarse como «indispensable» (Must have) en una priorización MoSCoW?`,
    o: [`Actualizar el inventario en línea a partir de cada venta registrada en el punto de venta.`,
        `Sugerir pedidos a proveedores a partir de los niveles mínimos de existencia por sucursal.`,
        `Mostrar a la gerencia un tablero de ventas por sucursal con comparativos mensuales.`],
    e: `Resolver la integración elimina la doble captura y da un inventario confiable. La sugerencia automática de pedidos depende de ese inventario y el tablero es deseable, no indispensable para resolver el problema.` },
  { a: 0, c: 'B', q: `¿Qué técnica de levantamiento de requerimientos permitió descubrir la doble captura, que ningún gerente mencionó?`,
    o: [`Observación directa del proceso en el lugar de trabajo, que revela prácticas que los usuarios no verbalizan.`,
        `Entrevista estructurada con los gerentes, que permite profundizar en las necesidades que cada uno expresa.`,
        `Análisis de documentos, como manuales y formatos, que muestra cómo debería ejecutarse el proceso.`],
    e: `El hallazgo surgió al observar al cajero en su puesto. Las entrevistas recogen lo que las personas dicen y los documentos, lo que debería hacerse, no lo que realmente se hace.` },
  { a: 0, q: `Un hotel con 300 habitaciones desea ofrecer Wi-Fi a sus huéspedes sin que estos puedan alcanzar los equipos del sistema de reservaciones ni las cámaras de seguridad, que operan sobre la misma infraestructura física de red. El personal administrativo debe conservar su acceso a esos sistemas. ¿Qué solución de red satisface la necesidad?`,
    o: [`Segmentar la red con una VLAN y un SSID exclusivos para huéspedes, y reglas de firewall que impidan su acceso a la red administrativa.`,
        `Mantener una sola red y un único SSID, y filtrar por dirección MAC los dispositivos de los huéspedes registrados en recepción.`,
        `Cifrar la red inalámbrica con WPA3 y una contraseña única por habitación, dentro de la misma red lógica que los sistemas del hotel.`],
    e: `El requisito es aislar el tráfico de huéspedes de los sistemas internos: se logra con segmentación (VLAN/SSID) y reglas de firewall. El filtrado por MAC y el cifrado de la red inalámbrica no separan las redes lógicas.` },
  { a: 0, q: `Una aseguradora determinó que sus servicios de cotización no pueden estar fuera de operación más de una hora tras un desastre en su centro de datos principal y que la pérdida de datos debe ser de apenas unos segundos. ¿Qué tipo de sitio alterno cumple con estos requisitos?`,
    o: [`Sitio activo (hot site): instalaciones y equipos operando en paralelo, con réplica continua de los datos.`,
        `Sitio tibio (warm site): instalaciones con equipo parcial, donde los datos se restauran desde respaldos periódicos.`,
        `Sitio frío (cold site): instalaciones con energía y conectividad, donde el equipo se adquiere e instala después del desastre.`],
    e: `Una recuperación en menos de una hora con pérdida de segundos exige equipo en operación y réplica continua: sitio activo. El tibio tarda horas y el frío, días.` },
  { a: 0, q: `Una empresa manufacturera mediana tiene procesos estándar de contabilidad, compras, inventarios y producción. Quiere operar en menos de seis meses, evitar el mantenimiento de código propio y adaptar el sistema mediante parametrización. ¿Qué opción de adquisición de software es la más adecuada?`,
    o: [`Un paquete ERP comercial, configurado mediante la parametrización de sus módulos estándar.`,
        `Un desarrollo a la medida con un proveedor externo, con entrega del código fuente para que la empresa lo mantenga.`,
        `Un conjunto de sistemas independientes por área, integrados mediante archivos de intercambio.`],
    e: `Procesos estándar, plazo corto, parametrización y ausencia de código propio son las condiciones de un ERP comercial. El desarrollo a la medida implica mantener código y los sistemas aislados no integran los procesos.` },
  { a: 0, q: `El área de recursos humanos de un corporativo solicita un portal de nómina. ¿Cuál de los siguientes enunciados es un requerimiento no funcional?`,
    o: [`El portal debe estar disponible al menos el 99.9 % del tiempo durante el horario laboral.`,
        `El portal debe permitir al empleado descargar su recibo de nómina en formato PDF.`,
        `El portal debe calcular las deducciones de impuestos con base en la tabla vigente.`],
    e: `La disponibilidad describe una cualidad con la que opera el sistema (no funcional). Descargar el recibo y calcular deducciones son funciones que el sistema realiza (funcionales).` },
  { a: 0, q: `Una productora de video necesita que varios editores trabajen simultáneamente sobre los mismos archivos de gran tamaño, accediendo a carpetas compartidas por la red local mediante los protocolos SMB o NFS. ¿Qué tipo de almacenamiento corresponde?`,
    o: [`NAS: almacenamiento conectado en red que entrega archivos y carpetas compartidas.`,
        `SAN: red de almacenamiento que entrega bloques a los servidores mediante una red dedicada.`,
        `DAS: almacenamiento conectado directamente a un único servidor o equipo.`],
    e: `El acceso a archivos compartidos por SMB o NFS en la red local es característico del NAS. La SAN entrega bloques a servidores y el DAS no se comparte en red.` },
  { a: 0, q: `Un centro de atención telefónica con 120 posiciones requiere administrar de forma centralizada el software de atención, reducir el mantenimiento de equipos y evitar que la información de los clientes quede almacenada en el equipo del agente. ¿Qué solución cubre estas necesidades?`,
    o: [`Clientes ligeros que acceden a escritorios virtuales (VDI) alojados en el centro de datos.`,
        `Computadoras de escritorio con una imagen estándar y software de administración remota de configuraciones.`,
        `Laptops con cifrado de disco completo y conexión a una red privada virtual (VPN).`],
    e: `Con VDI la información y el software residen en el centro de datos, el equipo del agente casi no requiere mantenimiento y no almacena datos. Las otras opciones dejan los datos en el equipo local.` },

  /* ===== ÁREA 2: Gestión de proyectos (9) ===== */
  { a: 1, c: 'C', q: `¿Qué deficiencia de planeación evidencia el caso?`,
    o: [`La identificación incompleta de interesados y de requisitos al planificar el alcance del proyecto.`,
        `La estimación deficiente de la duración de las actividades al elaborar el cronograma del proyecto.`,
        `La definición incompleta de los criterios de aceptación al planificar la gestión de la calidad del proyecto.`],
    e: `Un requisito legal omitido y un interesado con poder de veto que nadie identificó son fallas de la identificación de requisitos e interesados. El caso no habla de estimaciones de duración ni de criterios de aceptación.` },
  { a: 1, c: 'C', q: `¿Qué debe hacer el gerente del proyecto respecto de la firma electrónica?`,
    o: [`Documentar una solicitud de cambio, analizar su impacto en alcance, cronograma y costo, y someterla al control integrado de cambios, incluido el comité de finanzas.`,
        `Absorber el costo con la reserva para contingencias, sin solicitud formal, porque la firma electrónica es un requisito legal.`,
        `Reducir el alcance de otros entregables por un valor equivalente para integrar la firma electrónica sin modificar la línea base.`],
    e: `Todo cambio a las líneas base pasa por el control integrado de cambios. Aunque sea obligatorio, requiere análisis de impacto y aprobación. Las otras opciones evitan el proceso formal.` },
  { a: 1, c: 'C', q: `Con base en el modelo de poder e interés, ¿cómo debe gestionarse al director de comunicación social?`,
    o: [`Gestionarlo de cerca: involucrarlo y consultarlo en las decisiones, porque tiene alto poder y alto interés.`,
        `Mantenerlo satisfecho: darle información de alto nivel, porque tiene alto poder pero bajo interés.`,
        `Mantenerlo informado: enviarle reportes periódicos, porque tiene bajo poder pero alto interés.`],
    e: `Puede bloquear la publicación (alto poder) y exige participar con una campaña (alto interés). Los interesados con ambas características se gestionan de cerca.` },
  { a: 1, c: 'D', q: `Si la velocidad promedio del equipo se mantiene, ¿es posible cumplir la fecha deseada?`,
    o: [`No: se requieren 6 sprints (180 ÷ 30), uno más de lo deseado, por lo que habría que negociar el alcance o la fecha.`,
        `Sí: se requieren 5 sprints, porque la velocidad del equipo aumenta en cada iteración.`,
        `No: se requieren 7 sprints, porque debe reservarse un sprint final para las pruebas de aceptación.`],
    e: `180 puntos ÷ 30 puntos por sprint = 6 sprints. Para terminar en 5 se necesitarían 36 puntos por sprint; el texto no sustenta que la velocidad aumente ni que se requiera un sprint adicional.` },
  { a: 1, c: 'D', q: `¿Cómo debe tratarse el cambio de prioridades que solicita el Product Owner con el sprint en curso?`,
    o: [`Incorporarlo al backlog del producto y priorizarlo para el siguiente sprint, protegiendo el objetivo del sprint en curso.`,
        `Incorporarlo al sprint en curso y ampliar su duración hasta terminar las historias comprometidas y las nuevas.`,
        `Aceptarlo solo si el Scrum Master lo aprueba, ajustando el backlog del sprint sin consultar al equipo de desarrollo.`],
    e: `El sprint tiene duración fija y un objetivo que debe protegerse. Los cambios se ordenan en el backlog del producto para el siguiente sprint. No se alarga el sprint ni se decide sin el equipo.` },
  { a: 1, c: 'D', q: `¿Qué acción corrige que los desarrolladores acepten historias sin criterios de aceptación?`,
    o: [`Refinar el backlog con el Product Owner para que cada historia tenga criterios de aceptación antes de la planeación del sprint.`,
        `Definir los criterios de aceptación durante el sprint, conforme el desarrollador los necesite para construir la historia.`,
        `Encargar los criterios de aceptación al área de pruebas, al final del sprint, para validar lo ya construido.`],
    e: `Las historias deben estar claras y con criterios de aceptación antes de entrar al sprint; se logra con el refinamiento del backlog. Definirlos durante o después del sprint genera retrabajo e incertidumbre.` },
  { a: 1, q: `Un proyecto de implantación de una red tiene las siguientes actividades, con su duración en días y sus predecesoras: A (3 días, sin predecesora); B (4 días, después de A); C (2 días, después de A); D (5 días, después de B y de C); E (2 días, después de D). ¿Cuál es la ruta crítica, la duración del proyecto y la holgura de la actividad C?`,
    o: [`Ruta A-B-D-E; duración de 14 días; holgura de C de 2 días.`,
        `Ruta A-C-D-E; duración de 12 días; holgura de B de 2 días.`,
        `Ruta A-B-D-E; duración de 14 días; holgura de C de 4 días.`],
    e: `A-B-D-E = 3 + 4 + 5 + 2 = 14 días (la más larga); A-C-D-E = 3 + 2 + 5 + 2 = 12 días. C puede retrasarse 14 − 12 = 2 días sin afectar el proyecto (4 − 2 = 2 de holgura frente a B).` },
  { a: 1, q: `En un proyecto, el presupuesto total (BAC) es de $500,000. A la fecha, el trabajo realizado equivale al 40 % del alcance y se han gastado $260,000. Si el gerente supone que el desempeño de costos observado se mantendrá hasta el final, ¿cuál es la estimación a la conclusión (EAC)?`,
    o: [`$650,000, calculado como BAC ÷ CPI.`,
        `$560,000, calculado como AC + (BAC − EV), que supone que el trabajo restante se hará al costo presupuestado.`,
        `$500,000, calculado como BAC, que supone que el proyecto terminará dentro del presupuesto original.`],
    e: `EV = 40 % × 500,000 = 200,000. CPI = EV ÷ AC = 200,000 ÷ 260,000 ≈ 0.77. Si el desempeño actual continúa, EAC = BAC ÷ CPI = 650,000. La fórmula AC + (BAC − EV) aplica cuando la variación es atípica.` },
  { a: 1, q: `La dirección de TI contratará con un proveedor externo la migración de 40 servidores. El alcance, los entregables y los criterios de aceptación están completamente definidos, el presupuesto está aprobado y la organización no desea asumir el riesgo de sobrecostos. ¿Qué tipo de contrato conviene?`,
    o: [`Contrato de precio fijo cerrado, porque el alcance está bien definido y el riesgo de sobrecosto recae en el proveedor.`,
        `Contrato de costos reembolsables más honorarios, porque el comprador paga los costos reales y asume el riesgo de sobrecosto.`,
        `Contrato por tiempo y materiales, porque se paga por hora de trabajo con una tarifa pactada y el alcance puede ajustarse.`],
    e: `Alcance definido y deseo de no asumir el sobrecosto indican un contrato de precio fijo. Los otros dos trasladan al comprador total o parcialmente el riesgo de costo.` },

  /* ===== ÁREA 3: Implementación de sistemas (11) ===== */
  { a: 2, c: 'E', q: `¿Cómo debe modelarse la relación entre socios y clases?`,
    o: [`Como una relación de muchos a muchos, resuelta con la tabla intermedia reserva, que contiene las llaves foráneas de socio y de clase.`,
        `Como una relación de uno a muchos, resuelta con la llave foránea id_clase dentro de la tabla socio.`,
        `Como una relación de muchos a muchos, resuelta con una columna en la tabla clase que almacene la lista de id de sus socios.`],
    e: `Un socio reserva muchas clases y una clase recibe muchos socios: relación muchos a muchos, que se resuelve con una tabla intermedia. Guardar una lista en una columna viola la primera forma normal.` },
  { a: 2, c: 'E', q: `¿Cómo debe modelarse la relación entre socios y membresías, de acuerdo con las reglas del negocio?`,
    o: [`Uno a muchos, con id_socio como llave foránea en membresía y una restricción que permita solo una membresía vigente por socio.`,
        `Uno a uno, con id_membresía como llave foránea en socio, para apuntar siempre a la única membresía vigente.`,
        `Uno a muchos, con id_socio como llave foránea en membresía, eliminando la membresía anterior al contratar una nueva.`],
    e: `Un socio tiene varias membresías en el tiempo (uno a muchos) y se conserva el historial. La restricción de «una vigente» se impone con una regla, no borrando datos ni limitando la relación a uno a uno.` },
  { a: 2, c: 'E', q: `¿Qué consulta obtiene el nombre de cada instructor de la sucursal «Centro» que tenga más de 20 reservas, junto con su número de reservas?`,
    o: [`<code>SELECT i.nombre, COUNT(r.id) FROM instructor i JOIN clase c ON c.id_instructor = i.id JOIN reserva r ON r.id_clase = c.id JOIN sucursal s ON s.id = c.id_sucursal WHERE s.nombre = 'Centro' GROUP BY i.nombre HAVING COUNT(r.id) &gt; 20;</code>`,
        `<code>SELECT i.nombre, COUNT(r.id) FROM instructor i JOIN clase c ON c.id_instructor = i.id JOIN reserva r ON r.id_clase = c.id JOIN sucursal s ON s.id = c.id_sucursal WHERE s.nombre = 'Centro' AND COUNT(r.id) &gt; 20 GROUP BY i.nombre;</code>`,
        `<code>SELECT i.nombre, COUNT(r.id) FROM instructor i JOIN clase c ON c.id_instructor = i.id JOIN reserva r ON r.id_clase = c.id JOIN sucursal s ON s.id = c.id_sucursal GROUP BY i.nombre HAVING s.nombre = 'Centro' AND COUNT(r.id) &gt; 20;</code>`],
    e: `WHERE filtra filas antes de agrupar (la sucursal) y HAVING filtra los grupos con funciones de agregación (COUNT). No se pueden usar agregaciones en WHERE, y s.nombre no puede evaluarse en HAVING si no es parte del agrupamiento.` },
  { a: 2, c: 'E', q: `Con la base de datos en operación, dos socios reservan al mismo tiempo el último lugar de una clase y ambos reciben confirmación, de modo que la clase queda con un socio más que su cupo. ¿Qué medida evita este problema?`,
    o: [`Ejecutar la verificación del cupo y el registro de la reserva dentro de una misma transacción, con un nivel de aislamiento o bloqueo que impida lecturas concurrentes inconsistentes.`,
        `Crear un índice sobre la columna id_clase de la tabla reserva para acelerar el conteo de las reservas existentes.`,
        `Normalizar la tabla reserva hasta la tercera forma normal para eliminar la redundancia en los datos de cada reserva.`],
    e: `Es un problema de concurrencia: se resuelve con transacciones y control de aislamiento o bloqueo. Un índice mejora velocidad y la normalización evita redundancia, pero ninguno impide que dos transacciones lean el mismo cupo.` },
  { a: 2, c: 'F', q: `¿Qué vulnerabilidad explica el primer problema, en el que un cliente vio el historial de compras de otra persona?`,
    o: [`Control de acceso deficiente (referencia directa insegura a objetos): el sistema no valida que el pedido pertenezca al usuario autenticado.`,
        `Autenticación deficiente: el sistema permite contraseñas débiles y no bloquea los intentos repetidos de ingreso.`,
        `Exposición de datos sensibles: la información viaja sin cifrar entre el navegador y el servidor.`],
    e: `Cambiar el identificador en la dirección y obtener datos ajenos indica que el servidor no verifica la autorización sobre el objeto solicitado (IDOR). No se trata de contraseñas ni del cifrado en tránsito.` },
  { a: 2, c: 'F', q: `¿Qué vulnerabilidad explica el segundo problema y cómo se corrige?`,
    o: [`Inyección SQL; se corrige con consultas parametrizadas (sentencias preparadas) y validación de las entradas.`,
        `Secuencias de comandos entre sitios (XSS); se corrige codificando las salidas que se muestran en el navegador.`,
        `Falsificación de petición en sitios cruzados (CSRF); se corrige con tokens de verificación en los formularios.`],
    e: `La cadena <code>' OR '1'='1</code> altera la consulta a la base de datos: es inyección SQL. Su corrección principal son las consultas parametrizadas. XSS y CSRF son ataques de otra naturaleza.` },
  { a: 2, c: 'F', q: `¿Qué tipo de prueba omitida habría detectado el tercer problema?`,
    o: [`Pruebas de regresión, que verifican que las funciones existentes sigan operando después de un cambio.`,
        `Pruebas de humo, que verifican que las funciones principales arranquen antes de iniciar pruebas detalladas.`,
        `Pruebas de aceptación, que validan con el usuario que las características nuevas cumplan lo solicitado.`],
    e: `Una función que operaba en la versión 2.2 y dejó de funcionar en la 2.3 es una regresión. Solo se probaron las características nuevas, por lo que faltaron pruebas de regresión.` },
  { a: 2, q: `Un analista debe documentar los estados por los que pasa un pedido (creado, pagado, enviado, entregado o cancelado) y los eventos que provocan cada transición. ¿Qué diagrama UML es el más adecuado?`,
    o: [`Diagrama de estados (máquina de estados), que muestra los estados de un objeto y las transiciones entre ellos.`,
        `Diagrama de actividades, que muestra el flujo de acciones y decisiones de un proceso.`,
        `Diagrama de secuencia, que muestra el intercambio ordenado de mensajes entre objetos.`],
    e: `Los estados de un pedido y los eventos que los cambian se modelan con un diagrama de estados. El de actividades modela flujos de trabajo y el de secuencia, interacciones en el tiempo.` },
  { a: 2, q: `Durante la migración del sistema escolar anterior, se detectó que tres sistemas guardan las fechas en formatos distintos y que aproximadamente 4 % de los alumnos está duplicado. Antes de cargar los datos en el sistema nuevo, ¿en qué fase del proceso ETL debe resolverse esta situación?`,
    o: [`Transformación: se limpian, estandarizan y deduplican los datos extraídos antes de cargarlos.`,
        `Extracción: se obtienen los datos de cada sistema de origen sin alterar su contenido.`,
        `Carga: se insertan los datos en el sistema destino y se corrigen allí los errores detectados.`],
    e: `La limpieza, estandarización de formatos y eliminación de duplicados corresponde a la transformación. La extracción solo obtiene los datos y la carga los inserta ya depurados.` },
  { a: 2, q: `A una sucursal se le asignó la red 192.168.10.0/26. ¿Cuántos equipos pueden direccionarse y cuál es el rango utilizable?`,
    o: [`62 equipos, del 192.168.10.1 al 192.168.10.62.`,
        `64 equipos, del 192.168.10.0 al 192.168.10.63.`,
        `30 equipos, del 192.168.10.1 al 192.168.10.30.`],
    e: `Una máscara /26 deja 6 bits para equipos: 2⁶ = 64 direcciones, de las cuales la primera (.0) es la red y la última (.63) es el broadcast, por lo que quedan 62 utilizables (.1 a .62).` },
  { a: 2, q: `Una aplicación móvil envía a un servicio web REST el registro completo del cliente 25, con todos sus campos, para sustituir por completo la información existente de ese cliente. ¿Qué solicitud HTTP corresponde?`,
    o: [`<code>PUT /clientes/25</code>, con el cuerpo completo del recurso.`,
        `<code>PATCH /clientes/25</code>, con solo los campos que cambian.`,
        `<code>POST /clientes/25</code>, para crear un nuevo recurso asociado al cliente.`],
    e: `PUT reemplaza completamente un recurso existente. PATCH aplica modificaciones parciales y POST se utiliza normalmente para crear recursos.` },

  /* ===== ÁREA 4: Función informática (8) ===== */
  { a: 3, c: 'G', q: `¿Qué práctica de ITIL falta para atender los 14 incidentes con el mismo síntoma?`,
    o: [`Gestión de problemas, para identificar la causa raíz, registrar errores conocidos y evitar que los incidentes se repitan.`,
        `Gestión de incidentes, para restablecer el servicio con mayor rapidez mediante un escalamiento más ágil.`,
        `Gestión de niveles de servicio, para renegociar con los agentes los tiempos de resolución del SLA.`],
    e: `Los incidentes ya se resuelven dentro del SLA (25 min frente a 60). Lo que falta es investigar la causa de los incidentes recurrentes, que es el propósito de la gestión de problemas.` },
  { a: 3, c: 'G', q: `¿Qué práctica de ITIL atiende el hallazgo (b), referente a los cambios instalados directamente en producción?`,
    o: [`Gestión de cambios, para evaluar, autorizar y programar los cambios con apoyo de un comité asesor de cambios.`,
        `Gestión de configuraciones, para mantener actualizado el inventario de los elementos del portal y sus relaciones.`,
        `Gestión de la disponibilidad, para asegurar que el portal cumpla con los niveles de disponibilidad acordados.`],
    e: `Instalar cambios sin autorización documentada se corrige con la gestión de cambios (evaluación del riesgo, autorización y programación, normalmente con un comité asesor de cambios).` },
  { a: 3, c: 'G', q: `El hallazgo (c) y el deseo del Director General de alinear TI con el negocio corresponden a la responsabilidad de la alta dirección de evaluar las necesidades de las partes interesadas, dar dirección a TI y monitorear su desempeño. ¿A qué dominio de COBIT 2019 pertenece esa responsabilidad?`,
    o: [`EDM (Evaluar, Dirigir y Monitorear): gobierno, a cargo de la alta dirección.`,
        `MEA (Monitorear, Evaluar y Valorar): gestión, a cargo de la gerencia de TI sobre el desempeño y la conformidad.`,
        `APO (Alinear, Planificar y Organizar): gestión, a cargo de la gerencia de TI sobre la estrategia, el presupuesto y los riesgos.`],
    e: `En COBIT 2019 el gobierno se agrupa en el dominio EDM y lo ejerce la alta dirección. APO, BAI, DSS y MEA pertenecen a la gestión, que realiza la gerencia.` },
  { a: 3, c: 'G', q: `¿Cuál es la recomendación más adecuada para el Director General?`,
    o: [`Asignar un responsable de la gestión de problemas, formalizar el control de cambios con autorización previa y reportar al comité indicadores como incidentes recurrentes y disponibilidad del portal.`,
        `Aumentar la plantilla de la mesa de servicio para reducir el tiempo promedio de resolución por debajo de los 25 minutos actuales.`,
        `Renegociar el SLA para ampliar el tiempo de resolución a 90 minutos y evitar incumplimientos en los incidentes recurrentes.`],
    e: `Las tres deficiencias son de proceso y gobierno. Reducir un tiempo de resolución que ya cumple el SLA, o relajar el SLA, no ataca los incidentes recurrentes, los cambios sin control ni la falta de indicadores.` },
  { a: 3, q: `Un analista de nómina modificó sin autorización el monto de su propio bono en el sistema y el cambio no dejó ningún registro. ¿Qué principio de la seguridad de la información se vio comprometido de forma directa?`,
    o: [`Integridad: la información se alteró sin autorización y sin un rastro verificable.`,
        `Confidencialidad: la información de nómina se reveló a una persona sin autorización para conocerla.`,
        `Disponibilidad: se impidió a los usuarios autorizados acceder a la información de nómina.`],
    e: `La alteración no autorizada de datos afecta la integridad. La confidencialidad se compromete cuando se revela información y la disponibilidad cuando se impide el acceso.` },
  { a: 3, q: `Una empresa recaba nombres, correos y teléfonos de clientes mediante un formulario web para enviarles promociones. De acuerdo con la legislación mexicana de protección de datos personales en posesión de particulares, ¿qué debe hacer antes de tratar los datos?`,
    o: [`Poner a disposición del titular un aviso de privacidad que informe los datos recabados, las finalidades del tratamiento y los medios para ejercer sus derechos.`,
        `Solicitar a cada cliente una autorización por escrito con firma autógrafa para cualquier finalidad futura del tratamiento.`,
        `Cifrar la base de datos y comunicar al titular únicamente cuando ocurra una vulneración de seguridad.`],
    e: `La obligación previa al tratamiento es informar al titular mediante el aviso de privacidad. Cifrar y notificar vulneraciones son medidas de seguridad posteriores, y no se exige firma autógrafa para todo tratamiento.` },
  { a: 3, q: `Una empresa elaborará su plan de continuidad del negocio. ¿Qué debe realizar primero?`,
    o: [`El análisis de impacto al negocio (BIA), para identificar los procesos críticos y los tiempos de recuperación tolerables.`,
        `La contratación de un sitio alterno que garantice la recuperación inmediata de todos los servicios de TI.`,
        `La redacción de los procedimientos técnicos de recuperación paso a paso de cada servidor.`],
    e: `El BIA define qué procesos son críticos y cuánto tiempo pueden estar detenidos; con esa información se eligen las estrategias (como un sitio alterno) y se redactan los procedimientos.` },
  { a: 3, q: `Un empleado solicita a la mesa de servicio que se le instale una licencia de Visio, incluida en el catálogo de software aprobado de la empresa. En ITIL, ¿cómo debe clasificarse esta petición?`,
    o: [`Solicitud de servicio: petición formal de algo preestablecido en el catálogo, sin que exista una falla.`,
        `Incidente: interrupción o degradación de un servicio que debe restablecerse lo antes posible.`,
        `Cambio normal: modificación de riesgo no predefinido que requiere evaluación y autorización del comité de cambios.`],
    e: `Pedir un elemento preaprobado del catálogo, sin falla alguna, es una solicitud de servicio. No hay interrupción (incidente) ni una modificación que requiera evaluación individual de riesgo (cambio normal).` }
];

const KEY = 'egel-simulacro80-v1';
const app = document.getElementById('app');
const hdr = document.getElementById('hdr');
const toastEl = document.getElementById('toast');
const LET = ['A', 'B', 'C'];
let S = null;
let view = 'welcome'; // welcome | quiz | results
let confirmMode = null; // finish | restart | null
const warned = {};

const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const loadSaved = () => { try { const r = JSON.parse(localStorage.getItem(KEY)); return r && r.perms && r.perms.length === Q.length ? r : null; } catch (e) { return null; } };
const answered = () => S.answers.filter(a => a !== null).length;
const fmt = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const toTop = () => { try { window.scrollTo(0, 0); } catch (e) {} };
const remaining = () => S.endsAt - Date.now();

function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { toastEl.hidden = true; }, 6000);
}

function newAttempt(name) {
  const now = Date.now();
  S = { name, perms: Q.map(() => shuffle([0, 1, 2])), answers: Q.map(() => null), flags: Q.map(() => false), idx: 0,
        finished: false, timeUp: false, startedAt: now, endsAt: now + TOTAL_MIN * 60000, finishedAt: null };
  Object.keys(warned).forEach(k => delete warned[k]);
  confirmMode = null; view = 'quiz'; save(); render(); toTop();
}

function finish(timeUp) {
  S.finished = true; S.timeUp = !!timeUp; S.finishedAt = Math.min(Date.now(), S.endsAt);
  confirmMode = null; view = 'results'; save(); render(); toTop();
}

function tick() {
  if (view !== 'quiz' || !S || S.finished) return;
  const r = remaining();
  if (r <= 0) { toast('Se agotó el tiempo. Se muestran tus resultados.'); finish(true); return; }
  const c = document.getElementById('clock');
  if (c) { c.textContent = fmt(r); c.classList.toggle('low', r <= 10 * 60000); }
  [[600000, 'Quedan 10 minutos.'], [300000, 'Quedan 5 minutos.'], [60000, 'Queda 1 minuto. Revisa las preguntas sin responder.']].forEach(([t, m]) => {
    if (r <= t && !warned[t]) { warned[t] = true; if (r > t - 5000) toast(m); }
  });
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', tick);

function renderHeader() {
  if (view === 'quiz' && S) {
    hdr.innerHTML = '<div class="hl"><strong>EGEL Informática · Simulacro</strong><span>' + esc(S.name) + '</span></div>' +
      '<div class="hr"><span class="cnt">' + answered() + '/' + Q.length + '</span><span class="clock' + (remaining() <= 600000 ? ' low' : '') + '" id="clock" role="timer" aria-label="Tiempo restante">' + fmt(remaining()) + '</span></div>';
  } else if (view === 'results' && S) {
    hdr.innerHTML = '<div class="hl"><strong>EGEL Informática · Simulacro</strong><span>Resultados de ' + esc(S.name) + '</span></div>';
  } else {
    hdr.innerHTML = '<div class="hl"><strong>EGEL Informática · Simulacro</strong><span>80 minutos</span></div>';
  }
}

function render() {
  renderHeader();
  if (view === 'welcome') return renderWelcome();
  if (view === 'quiz') return renderQuiz();
  renderResults();
}

function renderWelcome() {
  const saved = loadSaved();
  const counts = AREAS.map((a, i) => Q.filter(q => q.a === i).length);
  const facts = '<div class="fact"><b>' + Q.length + '</b><span>reactivos</span></div><div class="fact"><b>' + TOTAL_MIN + '</b><span>minutos</span></div>' +
    AREAS.map((a, i) => '<div class="fact"><b>' + counts[i] + '</b><span>' + esc(a.short) + '</span></div>').join('');
  let resume = '';
  if (saved) {
    const n = saved.answers.filter(a => a !== null).length;
    const left = saved.endsAt - Date.now();
    const state = saved.finished ? 'terminado' : left > 0 ? 'en curso, con ' + fmt(left) + ' restantes' : 'con el tiempo agotado';
    resume = '<div class="resume"><p>Hay un intento ' + state + ' de <strong>' + esc(saved.name) + '</strong> (' + n + ' de ' + Q.length + ' respondidas).</p>' +
      '<div class="row"><button class="btn primary" data-a="resume">' + (saved.finished || left <= 0 ? 'Ver resultados' : 'Continuar') + '</button></div></div>';
  }
  app.innerHTML = '<section class="card hero"><h1>Simulacro EGEL Informática</h1>' +
    '<p class="lead">Examen de práctica en formato de casos, con lectura y análisis y tres opciones muy parecidas. Se distingue una de otra por un solo detalle, así que lee con cuidado.</p>' +
    '<div class="facts">' + facts + '</div>' +
    '<ul class="rules"><li>El cronómetro de 80 minutos empieza al comenzar y no se pausa. Al terminar el tiempo, el examen se cierra solo.</li>' +
    '<li>Puedes volver a cualquier pregunta y marcarla para revisar.</li><li>Al final verás aciertos por área y solo las preguntas que fallaste, con su explicación.</li></ul>' +
    resume +
    '<form class="field" id="nameForm" autocomplete="off"><label for="nameInput">¿Cómo te llamas?</label>' +
    '<input id="nameInput" type="text" maxlength="60" placeholder="Nombre y apellido" value="' + esc(saved ? saved.name : '') + '">' +
    '<div class="row" style="margin-top:8px"><button class="btn primary" id="startBtn" type="submit">' + (saved ? 'Iniciar nuevo simulacro' : 'Comenzar simulacro') + '</button></div></form></section>';
  const inp = document.getElementById('nameInput'), btn = document.getElementById('startBtn');
  const sync = () => { btn.disabled = !inp.value.trim(); };
  inp.addEventListener('input', sync); sync();
  document.getElementById('nameForm').addEventListener('submit', e => {
    e.preventDefault();
    const n = inp.value.trim();
    if (n) newAttempt(n);
  });
}

function caseHtml(c) {
  const k = CASES[c];
  return '<aside class="case" aria-label="Caso"><span class="ct">Lee el caso · ' + esc(k.t) + '</span>' + k.p.map(p => '<p>' + p + '</p>').join('') + '</aside>';
}
function casePos(i) {
  const c = Q[i].c; if (!c) return '';
  const ids = Q.map((q, k) => q.c === c ? k : -1).filter(k => k >= 0);
  return 'Pregunta ' + (ids.indexOf(i) + 1) + ' de ' + ids.length + ' del caso';
}

function renderQuiz() {
  const i = S.idx, q = Q[i], ar = AREAS[q.a], done = answered(), pct = Math.round(done / Q.length * 100);
  const opts = [0, 1, 2].map(k => '<button class="opt" role="radio" aria-checked="' + (S.answers[i] === S.perms[i][k]) + '" data-a="pick" data-k="' + k + '">' +
    '<span class="ltr">' + LET[k] + '</span><span class="txt">' + q.o[S.perms[i][k]] + '</span></button>').join('');

  let bar = '';
  if (confirmMode === 'finish') {
    const left = Q.length - done;
    bar = '<div class="confirm" role="alert"><p>' + (left ? 'Te faltan <strong>' + left + '</strong> pregunta' + (left > 1 ? 's' : '') + ' por responder y contarán como incorrectas. ' : '') +
      'Te quedan ' + fmt(remaining()) + ' minutos. ¿Terminar el examen y ver los resultados?</p>' +
      '<div class="row"><button class="btn primary" data-a="finish">Sí, terminar</button><button class="btn" data-a="cancel">Seguir respondiendo</button></div></div>';
  } else if (confirmMode === 'restart') {
    bar = '<div class="confirm" role="alert"><p>Se borrarán tus respuestas, el cronómetro volverá a 80:00 y las opciones se mezclarán de nuevo. ¿Iniciar de nuevo?</p>' +
      '<div class="row"><button class="btn dark" data-a="restart">Sí, iniciar de nuevo</button><button class="btn" data-a="cancel">Cancelar</button></div></div>';
  }

  const map = AREAS.map((a, ai) => {
    const dots = Q.map((x, qi) => x.a === ai ? '<button class="dot' + (S.answers[qi] !== null ? ' done' : '') + (S.flags[qi] ? ' fl' : '') + (qi === i ? ' cur' : '') + '" data-a="go" data-i="' + qi + '" aria-label="Pregunta ' + (qi + 1) + (S.answers[qi] !== null ? ', respondida' : ', sin responder') + (S.flags[qi] ? ', marcada para revisar' : '') + '"' + (qi === i ? ' aria-current="true"' : '') + '>' + (qi + 1) + '</button>' : '').join('');
    return '<div class="maprow"><span class="lab">Área ' + (ai + 1) + ' · ' + esc(a.short) + '</span><div class="dots">' + dots + '</div></div>';
  }).join('');

  app.innerHTML = '<div style="display:flex;flex-direction:column;gap:16px">' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + Q.length + '" aria-valuenow="' + done + '" aria-label="Preguntas respondidas"><i style="width:' + pct + '%"></i></div>' +
    '<section class="card" aria-live="polite"><div class="qhead"><span class="chip o">Área ' + (q.a + 1) + ' · ' + esc(ar.name) + '</span><span class="qnum">Pregunta ' + (i + 1) + ' de ' + Q.length + (q.c ? ' · ' + casePos(i) : '') + '</span></div>' +
    (q.c ? caseHtml(q.c) : '') +
    '<p class="qtext">' + q.q + '</p><div class="opts" role="radiogroup" aria-label="Opciones de respuesta">' + opts + '</div>' +
    '<div class="row" style="margin-top:18px"><button class="flag" data-a="flag" aria-pressed="' + S.flags[i] + '"><i></i>' + (S.flags[i] ? 'Marcada para revisar' : 'Marcar para revisar') + '</button></div></section>' +
    '<div class="row between"><button class="btn" data-a="prev"' + (i === 0 ? ' disabled' : '') + '>← Anterior</button>' +
    '<button class="btn" data-a="next"' + (i === Q.length - 1 ? ' disabled' : '') + '>Siguiente →</button></div>' +
    bar +
    '<section class="card map"><h3>Mapa de preguntas</h3>' + map +
    '<div class="legend"><span>Sin responder</span><span class="l1">Respondida</span><span class="l2">Pregunta actual</span></div></section>' +
    '<div class="row between"><button class="btn" data-a="askRestart">Iniciar de nuevo</button><button class="btn primary" data-a="askFinish">Terminar examen</button></div></div>';
}

function results() {
  const ok = AREAS.map(() => 0), tot = AREAS.map(() => 0), wrong = [];
  Q.forEach((q, i) => { tot[q.a]++; if (S.answers[i] === 0) ok[q.a]++; else wrong.push(i); });
  return { ok, tot, wrong, total: ok.reduce((a, b) => a + b, 0) };
}
function level(p) { return p >= 70 ? ['good', 'Sólido'] : p >= 50 ? ['mid', 'En desarrollo'] : ['low', 'Por reforzar']; }

function renderResults() {
  const r = results(), pct = Math.round(r.total / Q.length * 100);
  const used = Math.min(S.finishedAt - S.startedAt, TOTAL_MIN * 60000);
  const rows = AREAS.map((a, ai) => {
    const p = Math.round(r.ok[ai] / r.tot[ai] * 100), l = level(p);
    return '<tr><td>Área ' + (ai + 1) + ' · ' + esc(a.name) + '</td><td class="num">' + r.ok[ai] + '</td><td class="num">' + r.tot[ai] + '</td><td class="num">' + p + ' %</td>' +
      '<td><span class="meter" aria-hidden="true"><i style="width:' + p + '%"></i></span></td><td><span class="lvl ' + l[0] + '">' + l[1] + '</span></td></tr>';
  }).join('');
  const tl = level(pct);
  const table = '<div class="tablewrap"><table><thead><tr><th>Área</th><th class="num">Correctas</th><th class="num">Reactivos</th><th class="num">Porcentaje</th><th></th><th>Nivel</th></tr></thead><tbody>' + rows +
    '<tr class="total"><td>Total</td><td class="num">' + r.total + '</td><td class="num">' + Q.length + '</td><td class="num">' + pct + ' %</td><td></td><td><span class="lvl ' + tl[0] + '">' + tl[1] + '</span></td></tr></tbody></table></div>' +
    '<p class="note">Nivel de referencia para estudio: Sólido desde 70 %, En desarrollo de 50 a 69 %, Por reforzar por debajo de 50 %. No equivale al puntaje oficial del CENEVAL.</p>';

  let review;
  if (!r.wrong.length) {
    review = '<div class="card empty">Respondiste todo correctamente, ' + esc(S.name) + '. No hay preguntas para repasar.</div>';
  } else {
    review = r.wrong.map(i => {
      const q = Q[i], mine = S.answers[i];
      return '<article class="card rcard"><div class="qhead"><span class="chip o">Área ' + (q.a + 1) + ' · ' + esc(AREAS[q.a].name) + '</span><span class="qnum">Pregunta ' + (i + 1) + '</span></div>' +
        (q.c ? '<details class="dcase"><summary>Leer de nuevo el caso: ' + esc(CASES[q.c].t) + '</summary>' + caseHtml(q.c) + '</details>' : '') +
        '<p class="qtext">' + q.q + '</p>' +
        '<div class="ans bad"><span class="tag">Tu respuesta</span><span>' + (mine === null ? 'Sin responder' : q.o[mine]) + '</span></div>' +
        '<div class="ans good"><span class="tag">Correcta</span><span>' + q.o[0] + '</span></div>' +
        '<p class="why"><b>Por qué:</b> ' + esc(q.e).replace(/&lt;code&gt;/g, '<code>').replace(/&lt;\/code&gt;/g, '</code>') + '</p></article>';
    }).join('');
  }

  app.innerHTML = '<div style="display:flex;flex-direction:column;gap:16px">' +
    '<section class="card"><p class="qnum">Resultados de ' + esc(S.name) + ' · tiempo usado ' + fmt(used) + ' de ' + TOTAL_MIN + ':00</p>' +
    '<div class="score"><span class="big">' + r.total + ' / ' + Q.length + '</span><span class="pct">' + pct + ' % de aciertos</span></div>' +
    (S.timeUp ? '<p class="banner">Se agotó el tiempo. Las preguntas sin responder cuentan como incorrectas.</p>' : '') + table + '</section>' +
    '<div class="row"><button class="btn primary" data-a="restart">Iniciar de nuevo</button><button class="btn" data-a="rename">Cambiar nombre</button></div>' +
    '<h2 style="font-size:20px;margin-top:8px">Preguntas por repasar (' + r.wrong.length + ')</h2>' +
    '<div class="review">' + review + '</div>' +
    '<div class="row"><button class="btn primary" data-a="restart">Iniciar de nuevo</button></div></div>';
}

function go(n) { S.idx = Math.max(0, Math.min(Q.length - 1, n)); confirmMode = null; save(); render(); toTop(); }

app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a === 'pick') { S.answers[S.idx] = S.perms[S.idx][+b.dataset.k]; save(); render(); }
  else if (a === 'flag') { S.flags[S.idx] = !S.flags[S.idx]; save(); render(); }
  else if (a === 'prev') go(S.idx - 1);
  else if (a === 'next') go(S.idx + 1);
  else if (a === 'go') go(+b.dataset.i);
  else if (a === 'askFinish') { confirmMode = 'finish'; render(); }
  else if (a === 'askRestart') { confirmMode = 'restart'; render(); }
  else if (a === 'cancel') { confirmMode = null; render(); }
  else if (a === 'finish') finish(false);
  else if (a === 'restart') newAttempt(S.name);
  else if (a === 'rename') { view = 'welcome'; render(); toTop(); }
  else if (a === 'resume') {
    S = loadSaved();
    if (S.finished) { view = 'results'; render(); }
    else if (remaining() <= 0) finish(true);
    else { view = 'quiz'; render(); }
    toTop();
  }
});

document.addEventListener('keydown', e => {
  if (view !== 'quiz' || !S || e.target.closest('input') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'ArrowRight') go(S.idx + 1);
  else if (e.key === 'ArrowLeft') go(S.idx - 1);
  else {
    const k = ['a', 'b', 'c'].indexOf(e.key.toLowerCase()), kk = k >= 0 ? k : ['1', '2', '3'].indexOf(e.key);
    if (kk >= 0 && e.key.length === 1) { S.answers[S.idx] = S.perms[S.idx][kk]; save(); render(); }
  }
});

render();
</script>
</body>
</html>
