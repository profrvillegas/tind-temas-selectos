<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrenador EGEL Informática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: hoja de examen con tinta azul sobre papel frío; una pregunta por pantalla, mapa de reactivos siempre a la vista. */
:root {
  --bg: #F7F4F2;
  --surface: #FFFFFF;
  --ink: #231F20;
  --muted: #6B6365;
  --line: #E3DCD9;
  --accent: #FF5900;
  --accent-ink: #231F20;
  --ok: #1B7A4B;
  --bad: #B3261E;
  --warn: #9A5B00;
  --s0: #C74600;
  --s1: #231F20;
  --s2: #0F766E;
  --s3: #7C3AED;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181516; --surface: #231F20; --ink: #F3EEEC; --muted: #B3AAAC; --line: #3D3637;
    --accent: #FF5900; --accent-ink: #231F20; --ok: #55D190; --bad: #FF8A80; --warn: #F2B35E;
    --s0: #FF7A33; --s1: #D9D2D0; --s2: #4FD1C5; --s3: #B794F6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181516; --surface: #231F20; --ink: #F3EEEC; --muted: #B3AAAC; --line: #3D3637;
  --accent: #FF5900; --accent-ink: #231F20; --ok: #55D190; --bad: #FF8A80; --warn: #F2B35E;
  --s0: #FF7A33; --s1: #D9D2D0; --s2: #4FD1C5; --s3: #B794F6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-left: 6px solid var(--accent); padding-left: 10px; }
.who { font-size: 14px; color: var(--muted); }
.who strong { color: var(--ink); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 10px 18px; font-weight: 500; min-height: 44px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--line); filter: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }

/* Bienvenida */
.hero { border-top: 5px solid var(--accent); }
.hero h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 600; }
.hero .lead { color: var(--muted); max-width: 60ch; margin-top: 10px; }
.secgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 22px 0; }
.secitem { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; border-top: 4px solid var(--sc); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.secitem b { font-family: var(--font-mono); font-size: 22px; font-weight: 500; color: var(--sc); }
.secitem span { font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; max-width: 460px; }
.field label { font-weight: 500; }
.field input {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 11px 14px; min-height: 46px; width: 100%;
}
.field input:focus { border-color: var(--accent); }
.resume { border: 1px dashed var(--accent); border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }

/* Examen */
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress .meta { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 13px; color: var(--muted); gap: 8px; flex-wrap: wrap; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.chip {
  display: inline-block; font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--sc); background: color-mix(in srgb, var(--sc) 12%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--sc) 35%, var(--surface)); border-radius: 6px; padding: 3px 8px;
}
.qhead { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.qnum { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.qtext { font-size: 18px; line-height: 1.6; max-width: 70ch; }
.qtext code, .opt code { font-family: var(--font-mono); font-size: .9em; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.opt {
  display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 14px 16px;
}
.opt:hover { border-color: var(--accent); }
.opt .ltr {
  flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%;
  border: 1.5px solid var(--line); font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--muted);
}
.opt .txt { min-width: 0; overflow-wrap: anywhere; }
.opt[aria-checked="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.opt[aria-checked="true"] .ltr { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.map { display: flex; flex-direction: column; gap: 12px; }
.map h3 { font-size: 13px; font-family: var(--font-mono); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.maprow { display: flex; flex-direction: column; gap: 6px; }
.maprow .lab { font-size: 13px; color: var(--sc); font-weight: 500; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot {
  width: 38px; height: 38px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface);
  font-family: var(--font-mono); font-size: 13px; color: var(--muted); padding: 0;
}
.dot.done { background: color-mix(in srgb, var(--sc) 16%, var(--surface)); border-color: color-mix(in srgb, var(--sc) 60%, var(--surface)); color: var(--ink); }
.dot.cur { outline: 3px solid var(--accent); outline-offset: 1px; font-weight: 600; }

.confirm {
  border: 1.5px solid var(--warn); border-radius: 8px; padding: 14px 16px;
  background: color-mix(in srgb, var(--warn) 10%, var(--surface)); display: flex; flex-direction: column; gap: 12px;
}

/* Resultados */
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
.score .big { font-family: var(--font-mono); font-size: clamp(40px, 8vw, 64px); font-weight: 500; line-height: 1; }
.score .pct { font-size: 18px; color: var(--muted); }
.tablewrap { overflow-x: auto; margin-top: 16px; }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 600; border-bottom: none; background: var(--bg); }
.meter { width: 120px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.meter > i { display: block; height: 100%; }
.lvl { font-size: 13px; font-weight: 600; white-space: nowrap; }
.lvl.good { color: var(--ok); } .lvl.mid { color: var(--warn); } .lvl.low { color: var(--bad); }
.note { font-size: 13px; color: var(--muted); margin-top: 12px; }

.review { display: flex; flex-direction: column; gap: 14px; }
.rcard { border-left: 4px solid var(--sc); }
.ans { display: flex; gap: 10px; align-items: flex-start; border-radius: 8px; padding: 10px 12px; margin-top: 10px; border: 1px solid var(--line); }
.ans .tag { flex: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; font-weight: 500; padding-top: 3px; min-width: 92px; }
.ans.bad { border-color: color-mix(in srgb, var(--bad) 50%, var(--surface)); background: color-mix(in srgb, var(--bad) 7%, var(--surface)); }
.ans.bad .tag { color: var(--bad); }
.ans.good { border-color: color-mix(in srgb, var(--ok) 50%, var(--surface)); background: color-mix(in srgb, var(--ok) 7%, var(--surface)); }
.ans.good .tag { color: var(--ok); }
.why { margin-top: 12px; font-size: 15px; color: var(--muted); }
.why b { color: var(--ink); }
.empty { text-align: center; padding: 28px 12px; color: var(--ok); font-weight: 600; }

@media (max-width: 520px) {
  .card { padding: 18px; }
  .qtext { font-size: 17px; }
  .ans { flex-direction: column; gap: 2px; }
  .ans .tag { padding-top: 0; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<body>
<div class="wrap">
  <div class="topbar">
    <span class="brand">EGEL · Informática · Práctica</span>
    <span class="who" id="who"></span>
  </div>
  <main id="app"></main>
</div>

<script>
const SECTIONS = [
  { name: 'Necesidades informáticas de una organización', short: 'Necesidades informáticas', n: 11, c: 'var(--s0)' },
  { name: 'Gestión de proyectos informáticos', short: 'Gestión de proyectos', n: 8, c: 'var(--s1)' },
  { name: 'Implementación de sistemas de información', short: 'Implementación de sistemas', n: 10, c: 'var(--s2)' },
  { name: 'Función informática', short: 'Función informática', n: 7, c: 'var(--s3)' }
];

/* La opción correcta siempre es o[0] en el banco; el orden se mezcla en cada intento. */
const Q = [
  /* ===== Necesidades informáticas (11) ===== */
  { s: 0,
    q: 'Una empresa de renta de embarcaciones para transporte de mercancías requiere llevar el control de sus navíos y las solicitudes de servicio, así como cumplir con el reporte normativo en línea de las transacciones efectuadas que le exigen las autoridades y registrar sus entradas y salidas del puerto en el sistema portuario. ¿Qué sistemas corresponden a las necesidades informáticas para operar de acuerdo con lo requerido?',
    o: ['Sistema de gestión de flota y servicios, integración con la plataforma de reporte normativo de la autoridad e interfaz con el sistema portuario.',
        'Sistema de gestión de inventarios y servicios, integración con la plataforma de facturación del cliente e interfaz con el sistema bancario.',
        'Sistema de gestión de flota y servicios, integración con la plataforma de reporte interno de la gerencia e interfaz con el sistema de recursos humanos.'],
    e: 'Cada necesidad del enunciado tiene su sistema: controlar navíos y solicitudes (gestión de flota y servicios), reportar a la autoridad en línea (integración con la plataforma normativa) y registrar entradas y salidas (interfaz con el sistema portuario). Las otras opciones cambian al menos una de esas tres piezas por otra que el caso no pide.' },
  { s: 0,
    q: 'Una entidad gubernamental necesita actualizar sus equipos de seguridad informática de acuerdo con su planeación de negocios, la cual dicta la priorización de medidas de seguridad ante amenazas informáticas. Por ello, la entidad se ha enfocado en la intercepción de las conexiones de red efectuadas desde los dispositivos clientes hasta los ordenadores destino, así como el soporte a una navegación web segura y con alto rendimiento. ¿Qué equipo se requiere de acuerdo con la clasificación de las necesidades a nivel de hardware para seguridad informática?',
    o: ['Servidor proxy, que actúa como intermediario de las conexiones del cliente hacia el destino, filtra el contenido web y almacena en caché las respuestas.',
        'Firewall perimetral, que filtra el tráfico de entrada y salida de la red mediante reglas de puertos y protocolos, sin actuar como intermediario de las conexiones.',
        'Sistema de detección de intrusos (IDS), que monitorea el tráfico de la red y emite alertas, sin interceptar las conexiones ni almacenar respuestas.'],
    e: 'La intercepción de conexiones cliente-destino y la navegación con alto rendimiento (caché) son rasgos del servidor proxy. El firewall filtra por reglas y el IDS solo observa y alerta.' },
  { s: 0,
    q: 'Una aseguradora opera con un sistema de pólizas desarrollado en los años noventa, una plataforma web de agentes y una aplicación móvil de siniestros, todos con tecnologías distintas. Requiere que estas aplicaciones intercambien información mediante mensajes, sin reescribir cada una. ¿Qué componente de software cubre esta necesidad?',
    o: ['Middleware orientado a mensajes, que comunica aplicaciones heterogéneas mediante una capa intermedia de integración.',
        'Sistema gestor de base de datos, que centraliza la información de todas las aplicaciones en un único repositorio relacional.',
        'Sistema operativo de red, que administra los recursos compartidos y los usuarios de todos los equipos conectados.'],
    e: 'El middleware es la capa intermedia que permite que aplicaciones con tecnologías diferentes intercambien mensajes sin modificarlas. Centralizar datos o administrar recursos de red no resuelve la interoperabilidad.' },
  { s: 0,
    q: 'Una clínica debe conservar durante diez años los expedientes digitales de sus pacientes, respaldándolos todos los días. Los datos casi nunca se consultan después del primer año y el presupuesto de almacenamiento es limitado. ¿Qué solución de almacenamiento responde mejor a esta necesidad?',
    o: ['Biblioteca de cintas (LTO) para respaldo y archivo de largo plazo, con bajo costo por gigabyte y acceso poco frecuente.',
        'Arreglo de discos de estado sólido (SSD) en RAID 10 para respaldo y archivo, con alto rendimiento de lectura y acceso frecuente.',
        'Memoria caché distribuida para respaldo y archivo, con latencia mínima y acceso inmediato a todos los expedientes.'],
    e: 'Retención larga, consulta esporádica y presupuesto limitado apuntan al medio más barato por gigabyte: la cinta. SSD y caché ofrecen velocidad que el caso no necesita y encarecen la solución.' },
  { s: 0,
    q: 'Un corporativo con diez sucursales en distintas ciudades requiere que cada una acceda a los sistemas de la matriz utilizando como medio de transporte el Internet público, protegiendo la confidencialidad de la información. ¿Qué solución de red se requiere?',
    o: ['VPN sitio a sitio, que establece túneles cifrados (por ejemplo, IPsec) entre la matriz y cada sucursal sobre Internet.',
        'Enlace dedicado MPLS, que establece circuitos privados entre la matriz y cada sucursal sobre la red del proveedor de telecomunicaciones.',
        'VLAN por sucursal, que segmenta lógicamente el tráfico dentro de la red local de la matriz.'],
    e: 'La condición clave es usar Internet público con confidencialidad: eso lo resuelve una VPN con túneles cifrados. MPLS no utiliza Internet público y las VLAN segmentan una red local, no conectan sedes.' },
  { s: 0,
    q: 'La dirección general de una cadena de tiendas requiere explorar el histórico de ventas de varios años desde distintas perspectivas (producto, región y periodo) para definir su estrategia comercial. ¿Qué tipo de sistema satisface esta necesidad?',
    o: ['Sistema de inteligencia de negocios sobre un almacén de datos, con análisis multidimensional (OLAP).',
        'Sistema de procesamiento de transacciones (TPS), con captura en línea (OLTP) de cada venta realizada.',
        'Sistema de información gerencial (MIS), con reportes operativos periódicos de formato predefinido.'],
    e: 'Explorar datos históricos por varias dimensiones es análisis OLAP sobre un almacén de datos (inteligencia de negocios). El TPS captura transacciones y el MIS entrega reportes fijos, no exploración libre.' },
  { s: 0,
    q: 'Una empresa distribuidora necesita registrar el historial de contacto con sus clientes, dar seguimiento a las oportunidades de venta y planear campañas de promoción segmentadas. ¿Qué tipo de sistema cubre esta necesidad?',
    o: ['CRM, enfocado en la gestión de la relación con el cliente, sus contactos y oportunidades de venta.',
        'ERP, enfocado en la integración de los procesos internos de finanzas, producción y recursos humanos.',
        'SCM, enfocado en la gestión de la cadena de suministro, proveedores y logística de entrega.'],
    e: 'Historial de contacto, oportunidades de venta y campañas segmentadas son funciones propias de un CRM. El ERP integra procesos internos y el SCM gestiona proveedores y logística.' },
  { s: 0,
    q: 'Una empresa emergente quiere desplegar la aplicación que desarrollan sus programadores sin administrar servidores, sistema operativo ni ambiente de ejecución; solo desea controlar su código y sus datos. ¿Qué modelo de servicio en la nube necesita?',
    o: ['PaaS (plataforma como servicio), donde el proveedor gestiona la infraestructura y el ambiente de ejecución, y el cliente gestiona su aplicación.',
        'IaaS (infraestructura como servicio), donde el proveedor gestiona la infraestructura física, y el cliente gestiona el sistema operativo, el ambiente y su aplicación.',
        'SaaS (software como servicio), donde el proveedor gestiona toda la pila, y el cliente solo utiliza una aplicación ya construida.'],
    e: 'Si el cliente solo conserva su código y datos, y el proveedor se encarga del sistema operativo y del ambiente de ejecución, es PaaS. En IaaS el cliente administra el sistema operativo; en SaaS no desarrolla la aplicación.' },
  { s: 0,
    q: 'Al levantar requerimientos de un portal de ventas, el área usuaria establece: «el sistema debe responder cada consulta en menos de dos segundos con 500 usuarios concurrentes». ¿Cómo se clasifica este requerimiento?',
    o: ['No funcional, de rendimiento: describe una cualidad con la que el sistema debe operar.',
        'Funcional, de procesamiento: describe una operación que el sistema debe realizar sobre los datos.',
        'De restricción de dominio: describe una regla del negocio impuesta por la normatividad aplicable.'],
    e: 'Tiempo de respuesta y concurrencia son cualidades de operación, es decir, requerimientos no funcionales de rendimiento. Un requerimiento funcional describe qué hace el sistema.' },
  { s: 0,
    q: 'Un banco define que, ante una falla mayor, sus servicios de banca en línea deben restablecerse en un máximo de cuatro horas y que la pérdida tolerable de datos no debe superar los quince minutos. ¿Qué parámetros de continuidad está estableciendo?',
    o: ['RTO de 4 horas y RPO de 15 minutos.',
        'RPO de 4 horas y RTO de 15 minutos.',
        'MTTR de 4 horas y MTBF de 15 minutos.'],
    e: 'RTO (Recovery Time Objective) es el tiempo máximo para restablecer el servicio; RPO (Recovery Point Objective) es la pérdida máxima de datos tolerable. Las otras opciones invierten los valores o usan métricas de fiabilidad distintas.' },
  { s: 0,
    q: 'Una universidad requiere una suite de ofimática que no tenga costo de licencia y cuyo código fuente pueda modificarse y redistribuirse para adaptarla a sus laboratorios. ¿Qué tipo de software cumple con lo requerido?',
    o: ['Software de código abierto, con licencia (por ejemplo, GPL) que permite usar, modificar y redistribuir el código fuente.',
        'Software gratuito (freeware), de uso sin costo pero sin acceso al código fuente ni derecho a modificarlo.',
        'Software propietario con licencia por usuario, que permite el uso bajo pago y sin acceso al código fuente.'],
    e: 'Modificar y redistribuir el código solo es posible con software de código abierto. El freeware es gratuito pero cerrado, y el propietario es cerrado y de pago.' },

  /* ===== Gestión de proyectos informáticos (8) ===== */
  { s: 1,
    q: 'La Dirección de Tecnologías de la Información y Comunicación de un corporativo de telecomunicaciones en el ámbito nacional resolvió añadir acciones a la presentación de proyectos informáticos al involucrar un modelo para el análisis de interesados que permita agruparlos con base en su nivel de autoridad y participación. ¿Qué acción debe llevar a cabo para responder a las necesidades de los proyectos?',
    o: ['Elaborar una matriz de poder e interés (autoridad y participación) para clasificar a los interesados y definir la estrategia de involucramiento de cada grupo.',
        'Elaborar una matriz de trazabilidad de requisitos para vincular cada requisito con su entregable y con el interesado que lo solicitó.',
        'Elaborar una matriz de asignación de responsabilidades (RACI) para definir quién ejecuta, aprueba, consulta e informa en cada entregable.'],
    e: 'Agrupar interesados por autoridad (poder) y participación (interés) es el análisis con la matriz poder/interés de la gestión de interesados del PMBOK. La trazabilidad y la RACI se usan para otros fines.' },
  { s: 1,
    q: 'En el marco del PMBOK, un patrocinador desea que el proyecto de migración de servidores quede formalmente autorizado y que el gerente del proyecto cuente con la autoridad para aplicar recursos de la organización. ¿Qué documento debe emitirse?',
    o: ['Acta de constitución del proyecto, emitida por el patrocinador, que autoriza formalmente el proyecto y otorga autoridad al gerente.',
        'Plan para la dirección del proyecto, emitido por el gerente, que integra las líneas base y describe cómo se ejecutará el proyecto.',
        'Enunciado del alcance del proyecto, emitido por el equipo, que describe los entregables y los criterios de aceptación.'],
    e: 'El acta de constitución es el documento que autoriza formalmente el proyecto y da al gerente autoridad sobre los recursos. Se emite en el grupo de procesos de Inicio, antes de planificar.' },
  { s: 1,

const KEY = 'egel-informatica-v1';
const app = document.getElementById('app');
const who = document.getElementById('who');
const LET = ['A', 'B', 'C'];
let S = null;          // intento actual
let view = 'welcome';  // welcome | quiz | results
let confirmMode = null; // 'finish' | 'restart' | null

const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const loadSaved = () => { try { const r = JSON.parse(localStorage.getItem(KEY)); return r && r.perms && r.perms.length === Q.length ? r : null; } catch (e) { return null; } };
const wipe = () => { try { localStorage.removeItem(KEY); } catch (e) {} };
const answered = () => S.answers.filter(a => a !== null).length;
const optText = (i, k) => Q[i].o[S.perms[i][k]];

function newAttempt(name) {
  S = { name, perms: Q.map(() => shuffle([0, 1, 2])), answers: Q.map(() => null), idx: 0, finished: false };
  confirmMode = null; view = 'quiz'; save(); render(); toTop();
}
function toTop() { try { window.scrollTo(0, 0); } catch (e) {} }

function render() {
  who.innerHTML = S && view !== 'welcome' ? 'Alumno: <strong>' + esc(S.name) + '</strong>' : '';
  if (view === 'welcome') return renderWelcome();
  if (view === 'quiz') return renderQuiz();
  renderResults();
}

function renderWelcome() {
  const saved = loadSaved();
  const secs = SECTIONS.map(s => '<div class="secitem" style="--sc:' + s.c + '"><b>' + s.n + '</b><span>' + esc(s.short) + '</span></div>').join('');
  let resume = '';
  if (saved) {
    const n = saved.answers.filter(a => a !== null).length;
    resume = '<div class="resume"><p>' + (saved.finished ? 'Tienes un intento terminado de ' : 'Tienes un intento en curso de ') + '<strong>' + esc(saved.name) + '</strong> (' + n + ' de ' + Q.length + ' respondidas).</p>' +
      '<div class="row"><button class="btn primary" data-a="resume">' + (saved.finished ? 'Ver resultados' : 'Continuar') + '</button></div></div>';
  }
  app.innerHTML = '<section class="card hero"><h1>Entrenador EGEL Informática</h1>' +
    '<p class="lead">' + Q.length + ' reactivos de práctica con tres opciones muy parecidas, distribuidos como en el examen. Al terminar verás tus aciertos por sección y solo las preguntas que fallaste, con su explicación.</p>' +
    '<div class="secgrid">' + secs + '</div>' + resume +
    '<form class="field" id="nameForm" autocomplete="off"><label for="nameInput">¿Cómo te llamas?</label>' +
    '<input id="nameInput" type="text" maxlength="60" placeholder="Nombre y apellido" value="' + esc(saved ? saved.name : '') + '">' +
    '<div class="row" style="margin-top:8px"><button class="btn primary" id="startBtn" type="submit">' + (saved ? 'Iniciar de nuevo' : 'Comenzar') + '</button></div></form></section>';
  const inp = document.getElementById('nameInput'), btn = document.getElementById('startBtn');
  const sync = () => { btn.disabled = !inp.value.trim(); };
  inp.addEventListener('input', sync); sync();
  document.getElementById('nameForm').addEventListener('submit', e => {
    e.preventDefault();
    const n = inp.value.trim();
    if (n) newAttempt(n);
  });
}

function renderQuiz() {
  const i = S.idx, q = Q[i], sec = SECTIONS[q.s], done = answered(), pct = Math.round(done / Q.length * 100);
  const opts = [0, 1, 2].map(k => '<button class="opt" role="radio" aria-checked="' + (S.answers[i] === S.perms[i][k]) + '" data-a="pick" data-k="' + k + '">' +
    '<span class="ltr">' + LET[k] + '</span><span class="txt">' + optText(i, k) + '</span></button>').join('');

  let bar = '';
  if (confirmMode === 'finish') {
    const left = Q.length - done;
    bar = '<div class="confirm" role="alert"><p>' + (left ? 'Te faltan <strong>' + left + '</strong> pregunta' + (left > 1 ? 's' : '') + ' por responder y contarán como incorrectas. ' : '') + '¿Terminar el examen y ver los resultados?</p>' +
      '<div class="row"><button class="btn primary" data-a="finish">Sí, terminar</button><button class="btn" data-a="cancel">Seguir respondiendo</button></div></div>';
  } else if (confirmMode === 'restart') {
    bar = '<div class="confirm" role="alert"><p>Se borrarán tus respuestas y las opciones se mezclarán de nuevo. ¿Iniciar de nuevo?</p>' +
      '<div class="row"><button class="btn danger" data-a="restart">Sí, iniciar de nuevo</button><button class="btn" data-a="cancel">Cancelar</button></div></div>';
  }

  const map = SECTIONS.map((s, si) => {
    const dots = Q.map((x, qi) => x.s === si ? '<button class="dot' + (S.answers[qi] !== null ? ' done' : '') + (qi === i ? ' cur' : '') + '" data-a="go" data-i="' + qi + '" aria-label="Pregunta ' + (qi + 1) + (S.answers[qi] !== null ? ', respondida' : '') + '"' + (qi === i ? ' aria-current="true"' : '') + '>' + (qi + 1) + '</button>' : '').join('');
    return '<div class="maprow" style="--sc:' + s.c + '"><span class="lab">' + esc(s.short) + '</span><div class="dots">' + dots + '</div></div>';
  }).join('');

  app.innerHTML = '<div style="display:flex;flex-direction:column;gap:16px">' +
    '<div class="progress"><div class="meta"><span>Respondidas ' + done + ' / ' + Q.length + '</span><span>' + pct + ' %</span></div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
    '<section class="card" aria-live="polite"><div class="qhead"><span class="chip" style="--sc:' + sec.c + '">' + esc(sec.name) + '</span><span class="qnum">Pregunta ' + (i + 1) + ' de ' + Q.length + '</span></div>' +
    '<p class="qtext">' + q.q + '</p><div class="opts" role="radiogroup" aria-label="Opciones de respuesta">' + opts + '</div></section>' +
    '<div class="row between"><button class="btn" data-a="prev"' + (i === 0 ? ' disabled' : '') + '>← Anterior</button>' +
    '<button class="btn" data-a="next"' + (i === Q.length - 1 ? ' disabled' : '') + '>Siguiente →</button></div>' +
    bar +
    '<section class="card map"><h3>Mapa de preguntas</h3>' + map + '</section>' +
    '<div class="row between"><button class="btn" data-a="askRestart">Iniciar de nuevo</button><button class="btn primary" data-a="askFinish">Terminar examen</button></div></div>';
}

function results() {
  const ok = SECTIONS.map(() => 0), tot = SECTIONS.map(() => 0), wrong = [];
  Q.forEach((q, i) => { tot[q.s]++; if (S.answers[i] === 0) ok[q.s]++; else wrong.push(i); });
  return { ok, tot, wrong, total: ok.reduce((a, b) => a + b, 0) };
}
function level(p) { return p >= 70 ? ['good', 'Sólido'] : p >= 50 ? ['mid', 'En desarrollo'] : ['low', 'Por reforzar']; }

function renderResults() {
  const r = results(), pct = Math.round(r.total / Q.length * 100);
  const rows = SECTIONS.map((s, si) => {
    const p = Math.round(r.ok[si] / r.tot[si] * 100), l = level(p);
    return '<tr><td><span class="chip" style="--sc:' + s.c + '">' + esc(s.name) + '</span></td><td class="num">' + r.ok[si] + '</td><td class="num">' + r.tot[si] + '</td><td class="num">' + p + ' %</td>' +
      '<td><span class="meter" aria-hidden="true"><i style="width:' + p + '%;background:var(--' + (l[0] === 'good' ? 'ok' : l[0] === 'mid' ? 'warn' : 'bad') + ')"></i></span></td><td><span class="lvl ' + l[0] + '">' + l[1] + '</span></td></tr>';
  }).join('');
  const tl = level(pct);
  const table = '<div class="tablewrap"><table><thead><tr><th>Sección</th><th class="num">Correctas</th><th class="num">Reactivos</th><th class="num">Porcentaje</th><th></th><th>Nivel</th></tr></thead><tbody>' + rows +
    '<tr class="total"><td>Total</td><td class="num">' + r.total + '</td><td class="num">' + Q.length + '</td><td class="num">' + pct + ' %</td><td></td><td><span class="lvl ' + tl[0] + '">' + tl[1] + '</span></td></tr></tbody></table></div>' +
    '<p class="note">Nivel de referencia para estudio: Sólido desde 70 %, En desarrollo de 50 a 69 %, Por reforzar por debajo de 50 %. No equivale al puntaje oficial del CENEVAL.</p>';

  let review;
  if (!r.wrong.length) {
    review = '<div class="card empty">Respondiste todo correctamente, ' + esc(S.name) + '. No hay preguntas para repasar.</div>';
  } else {
    review = r.wrong.map(i => {
      const q = Q[i], sec = SECTIONS[q.s], mine = S.answers[i];
      return '<article class="card rcard" style="--sc:' + sec.c + '"><div class="qhead"><span class="chip" style="--sc:' + sec.c + '">' + esc(sec.name) + '</span><span class="qnum">Pregunta ' + (i + 1) + '</span></div>' +
        '<p class="qtext">' + q.q + '</p>' +
        '<div class="ans bad"><span class="tag">Tu respuesta</span><span>' + (mine === null ? 'Sin responder' : q.o[mine]) + '</span></div>' +
        '<div class="ans good"><span class="tag">Correcta</span><span>' + q.o[0] + '</span></div>' +
        '<p class="why"><b>Por qué:</b> ' + esc(q.e) + '</p></article>';
    }).join('');
  }

  app.innerHTML = '<div style="display:flex;flex-direction:column;gap:16px">' +
    '<section class="card"><p class="brand">Resultados de ' + esc(S.name) + '</p><div class="score"><span class="big">' + r.total + ' / ' + Q.length + '</span><span class="pct">' + pct + ' % de aciertos</span></div>' + table + '</section>' +
    '<div class="row"><button class="btn primary" data-a="restart">Iniciar de nuevo</button><button class="btn" data-a="rename">Cambiar nombre</button></div>' +
    '<h2 style="font-size:20px;margin-top:8px">Preguntas por repasar (' + r.wrong.length + ')</h2>' +
    '<div class="review">' + review + '</div>' +
    '<div class="row"><button class="btn primary" data-a="restart">Iniciar de nuevo</button></div></div>';
}

function go(n) { S.idx = Math.max(0, Math.min(Q.length - 1, n)); confirmMode = null; save(); render(); toTop(); }

app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.dataset.a;
  if (a === 'pick') { S.answers[S.idx] = S.perms[S.idx][+b.dataset.k]; save(); render(); }
  else if (a === 'prev') go(S.idx - 1);
  else if (a === 'next') go(S.idx + 1);
  else if (a === 'go') go(+b.dataset.i);
  else if (a === 'askFinish') { confirmMode = 'finish'; render(); }
  else if (a === 'askRestart') { confirmMode = 'restart'; render(); }
  else if (a === 'cancel') { confirmMode = null; render(); }
  else if (a === 'finish') { S.finished = true; confirmMode = null; view = 'results'; save(); render(); toTop(); }
  else if (a === 'restart') newAttempt(S.name);
  else if (a === 'rename') { view = 'welcome'; render(); toTop(); }
  else if (a === 'resume') { S = loadSaved(); view = S.finished ? 'results' : 'quiz'; render(); toTop(); }
});

document.addEventListener('keydown', e => {
  if (view !== 'quiz' || !S || e.target.closest('input') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'ArrowRight') go(S.idx + 1);
  else if (e.key === 'ArrowLeft') go(S.idx - 1);
  else if ('abc'.includes(e.key.toLowerCase()) && e.key.length === 1 || ['1', '2', '3'].includes(e.key)) {
    const k = ['a', 'b', 'c'].indexOf(e.key.toLowerCase()); const kk = k >= 0 ? k : +e.key - 1;
    S.answers[S.idx] = S.perms[S.idx][kk]; save(); render();
  }
});

render();
</script>
</body>
</html>
